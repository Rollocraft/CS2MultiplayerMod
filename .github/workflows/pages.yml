name: Deploy documentation

on:
  push:
    branches:
      - master
      - main
    paths:
      - "help/**"
      - "documentation/**"
      - "docs-requirements.txt"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs-requirements.txt

      - name: Install documentation dependencies
        run: |
          pip install -r docs-requirements.txt

      - name: Build
        run: python documentation/build.py

      - name: Check documentation links and search
        run: |
          python -m unittest discover -s documentation/tests
          node --test documentation/tests/search.test.cjs documentation/tests/theme.test.cjs documentation/tests/navigation.test.cjs

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

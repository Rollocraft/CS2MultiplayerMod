# ===================== Friendly connection errors =====================
CS2MP.Error.Password = La password non è stata accettata.
CS2MP.Error.Password.Help = Verifica la password con l'host, reinseriscila e riprova. Le password distinguono maiuscole e minuscole.
CS2MP.Error.ModVersion = Le vostre versioni della mod multigiocatore non coincidono.
CS2MP.Error.ModVersion.Help = Entrambi i giocatori devono aggiornare la mod alla stessa versione, riavviare il gioco e riprovare.
CS2MP.Error.GameVersion = Le vostre versioni di Cities: Skylines II non coincidono.
CS2MP.Error.GameVersion.Help = Aggiornate il gioco su entrambi i PC e assicuratevi che i due giocatori usino lo stesso ramo Steam, poi riavviate.
CS2MP.Error.Dlc = I DLC attivati non coincidono tra l'host e questo giocatore.
CS2MP.Error.Dlc.Help = Attivate gli stessi DLC su entrambi i PC, riavviate il gioco e riprovate.
CS2MP.Error.Mods = Sono attive altre mod.
CS2MP.Error.Mods.Help = Il multigiocatore non supporta altre mod. Disattiva tutte le mod tranne CS2 Multiplayer Mod nel tuo playset attivo, poi riavvia il gioco.
CS2MP.Error.Full = Questa sessione multigiocatore è piena.
CS2MP.Error.Full.Help = Chiedi all'host di aumentare Giocatori max, oppure aspetta che esca un altro giocatore.
CS2MP.Error.Address = Non è stato possibile trovare l'indirizzo dell'host.
CS2MP.Error.Address.Help = Controlla che l'indirizzo non contenga errori di battitura. Sulla stessa rete domestica usa l'indirizzo IP locale del PC dell'host.
CS2MP.Error.Refused = Il PC dell'host ha risposto, ma su quella porta non è in ascolto nessuna sessione multigiocatore.
CS2MP.Error.Refused.Help = Assicurati che l'host abbia premuto Ospita la sessione e che entrambi i giocatori abbiano inserito la stessa porta.
CS2MP.Error.Timeout = L'host non ha risposto in tempo.
CS2MP.Error.Timeout.Help = Verifica che l'host sia ancora online, controlla indirizzo e porta e consenti la porta nel firewall dell'host. Le partite via Internet richiedono anche l'inoltro della porta TCP.
CS2MP.Error.Network = Questo PC non riesce a raggiungere la rete dell'host.
CS2MP.Error.Network.Help = Controlla la tua connessione a Internet o alla rete locale, poi riprova. Se siete sulla stessa rete, usa l'IP locale dell'host.
CS2MP.Error.PortInUse = La porta di hosting è già usata da un altro programma.
CS2MP.Error.PortInUse.Help = Chiudi l'altra istanza del server o del gioco, oppure scegli una porta diversa e comunica esattamente quella porta a tutti i giocatori.
CS2MP.Error.Removed = L'host ti ha rimosso da questa sessione multigiocatore.
CS2MP.Error.Removed.Help = Parla con l'host prima di provare a rientrare.
CS2MP.Error.Declined = L'host non ti ha fatto entrare nella sessione.
CS2MP.Error.Declined.Help = L'host deve approvare il tuo accesso. Chiedigli di farti entrare, poi riprova.
CS2MP.Error.Generic = Il multigiocatore non è riuscito a completare la connessione.
CS2MP.Error.Generic.Help = Riprova. Se si ripete, riavviate entrambi i giochi, verificate indirizzo e porta e controllate che la mod sia aggiornata su tutti e due i PC.


# -- General tab --
@label.EnableMod = Attiva la mod
@desc.EnableMod = Attiva o disattiva la mod multigiocatore.

@label.PlayerName = Nome giocatore
@desc.PlayerName = Il nome con cui ti vedono gli altri giocatori.

@label.ShowPartnerMarkers = Mostra i marcatori dei compagni
@desc.ShowPartnerMarkers = Disegna un anello colorato nel punto in cui sta guardando ogni altro giocatore, con una linea che sale fino alla sua telecamera. Disattivalo se preferisci guadagnare fotogrammi: è l'unica parte della mod che disegna a ogni fotogramma.

@label.IgnoreModCompatibilityChecks = Ignora i controlli di compatibilità delle mod (a tuo rischio)
@desc.IgnoreModCompatibilityChecks = Consente altre mod attive e, quando ospiti, versioni diverse di CS2 Multiplayer Mod. Questo può causare desincronizzazioni, città danneggiate o crash. I controlli su protocollo, versione del gioco e DLC restano attivi. Modificalo solo quando sei offline.

@label.VerboseLogging = Log dettagliato
@desc.VerboseLogging = Registra più dettagli per la risoluzione dei problemi (ogni azione di sincronizzazione e la diagnostica periodica). Lascialo disattivato per log più snelli; attivalo quando vuoi condividere un log dettagliato mentre chiedi aiuto.

@label.StatusRole = Ruolo
@desc.StatusRole = Indica se questa istanza è offline, sta ospitando o si è unita come client.

@label.StatusState = Connessione
@desc.StatusState = Stato attuale della connessione o ultimo errore offline.

@label.StatusPlayers = Giocatori
@desc.StatusPlayers = Giocatori connessi visibili a questa sessione.

@label.StatusAccess = Accesso
@desc.StatusAccess = Indica se per unirsi serve la password del server.

@label.StatusExposure = Rete
@desc.StatusExposure = Indica se l'host è limitato alla rete locale o accetta connessioni da Internet/LAN.

@label.StatusWorld = Mondo
@desc.StatusWorld = Stato attuale di caricamento o hosting del mondo dell'host.

@label.DisconnectButton = Disconnetti
@desc.DisconnectButton = Abbandona la sessione in corso e chiude tutte le connessioni.

# -- Join tab --
@label.JoinConnection = Connessione
@desc.JoinConnection = Il relay Steam ti collega all'host con il codice che ti ha dato, senza indirizzo né porta. La connessione diretta è il metodo originale: inserisci indirizzo e porta dell'host. Usa quello che ha scelto l'host.

@label.JoinCodeInput = Codice di accesso
@desc.JoinCodeInput = Il codice che l'host legge sulla sua schermata di hosting. Non serve che corrisponda nient'altro.

@label.ServerAddress = Indirizzo dell'host
@desc.ServerAddress = Indirizzo IP o nome host del giocatore che ospita la partita (lo vede nel suo log quando avvia l'hosting).

@label.JoinPort = Porta
@desc.JoinPort = Porta TCP dell'host (25001 come impostazione predefinita). Deve corrispondere esattamente alla porta aperta dall'host.

@label.JoinPassword = Password
@desc.JoinPassword = La password del server dell'host, se ne ha impostata una. Non viene mai inviata in chiaro.

@label.JoinStatus = Stato
@desc.JoinStatus = Stato attuale della connessione. Unirsi funziona dal menu principale: la città viene trasferita dall'host.

@label.JoinButton = Unisciti alla sessione
@desc.JoinButton = Si collega all'host indicato sopra e scarica la sua città. Funziona dal menu principale; non serve alcun salvataggio locale. È la stessa azione della finestra Unisciti a una partita del menu principale.

@label.JoinDisconnectButton = Disconnetti
@desc.JoinDisconnectButton = Abbandona la sessione in corso e chiude tutte le connessioni.

# -- Host tab --
@label.HostConnection = Connessione
@desc.HostConnection = Con il relay Steam gli amici si uniscono con il solo codice di accesso: nessuna porta da aprire e nessuna configurazione del router. La connessione diretta è il metodo originale: richiede una porta inoltrata, ma funziona senza Steam.

@label.HostJoinCode = Il tuo codice di accesso
@desc.HostJoinCode = Dallo ai tuoi amici. Lo incollano in Indirizzo dell'host nella loro schermata di connessione e si collegano subito.

@label.HostPort = Porta da aprire
@desc.HostPort = Porta TCP su cui è in ascolto il tuo server (1-65535, 25001 come impostazione predefinita). I giocatori che si uniscono devono inserire esattamente questa porta. Per giocare via Internet, inoltra questa porta TCP sul router verso questo PC e consentila nel Windows Firewall.

@label.HostPassword = Password del server
@desc.HostPassword = I giocatori devono inserirla per unirsi (non viene mai inviata in chiaro). Fortemente consigliata per giocare via Internet: senza password, chiunque trovi la porta può unirsi e scaricare la tua città.

@label.LanOnly = Solo LAN
@desc.LanOnly = Accetta solo giocatori della tua rete locale. Disattivato per impostazione predefinita, così gli amici possono unirsi via Internet (richiede l'inoltro della porta). Per giocare via Internet è vivamente consigliata una password robusta.

@label.RequireJoinApproval = Approva i giocatori che si uniscono
@desc.RequireJoinApproval = Se attivo, ogni giocatore che prova a unirsi attende mentre a te compare una richiesta di accettare o rifiutare. Disattivalo per ammettere automaticamente chiunque superi i controlli di password e versione.

@label.MaxPlayers = Giocatori max
@desc.MaxPlayers = Numero massimo di giocatori contemporanei, incluso te (2-32).

@label.ResyncMinutes = Risincronizzazione del mondo (minuti)
@desc.ResyncMinutes = Con quale frequenza l'intero mondo viene risalvato e inviato ai client per correggere eventuali scostamenti. Più basso = più coerente, ma più pause di caricamento.

@label.HostStatus = Stato dell'hosting
@desc.HostStatus = L'hosting richiede una città caricata: la tua città è il mondo in cui giocano tutti.

@label.HostButton = Ospita la sessione
@desc.HostButton = Apre la tua città attuale come server sulla porta indicata sopra. Il log elenca gli indirizzi esatti che gli altri giocatori possono usare. I giocatori che si collegano ricevono la mappa automaticamente.

@label.SyncWorldButton = Sincronizza il mondo
@desc.SyncWorldButton = Reinvia subito la tua città a tutti i giocatori connessi, sostituendo la loro copia. Usalo per eliminare qualsiasi scostamento tra i giocatori. È lo stesso pulsante Sincronizza il mondo del pannello multigiocatore in partita, tenuto qui come alternativa nel caso quel pulsante manchi.


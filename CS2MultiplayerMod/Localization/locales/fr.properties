# ===================== Friendly connection errors =====================
CS2MP.Error.Password = Le mot de passe a été refusé.
CS2MP.Error.Password.Help = Vérifiez le mot de passe auprès de l'hôte, saisissez-le à nouveau et réessayez. Les mots de passe sont sensibles à la casse.
CS2MP.Error.ModVersion = Vos versions du mod multijoueur ne correspondent pas.
CS2MP.Error.ModVersion.Help = Les deux joueurs doivent mettre le mod à jour dans la même version, redémarrer le jeu et réessayer.
CS2MP.Error.GameVersion = Vos versions de Cities: Skylines II ne correspondent pas.
CS2MP.Error.GameVersion.Help = Mettez le jeu à jour sur les deux PC et assurez-vous que les deux joueurs utilisent la même branche Steam, puis redémarrez.
CS2MP.Error.Dlc = Les DLC activés ne correspondent pas entre l'hôte et ce joueur.
CS2MP.Error.Dlc.Help = Activez les mêmes DLC sur les deux PC, redémarrez le jeu et réessayez.
CS2MP.Error.Mods = D'autres mods sont activés.
CS2MP.Error.Mods.Help = Le multijoueur ne prend pas en charge les autres mods. Désactivez tous les mods sauf CS2 Multiplayer Mod dans votre playset actif, puis redémarrez le jeu.
CS2MP.Error.Full = Cette session multijoueur est pleine.
CS2MP.Error.Full.Help = Demandez à l'hôte d'augmenter « Joueurs max. », ou attendez qu'un autre joueur parte.
CS2MP.Error.Address = L'adresse de l'hôte est introuvable.
CS2MP.Error.Address.Help = Vérifiez que l'adresse ne contient pas de faute de frappe. Sur le même réseau domestique, utilisez l'adresse IP locale du PC de l'hôte.
CS2MP.Error.Refused = Le PC de l'hôte a répondu, mais aucune session multijoueur n'écoute sur ce port.
CS2MP.Error.Refused.Help = Assurez-vous que l'hôte a bien cliqué sur « Héberger la session » et que les deux joueurs ont saisi le même port.
CS2MP.Error.Timeout = L'hôte n'a pas répondu à temps.
CS2MP.Error.Timeout.Help = Vérifiez que l'hôte est toujours en ligne, contrôlez l'adresse et le port, et autorisez le port dans le pare-feu de l'hôte. Les parties par Internet nécessitent aussi une redirection de port TCP.
CS2MP.Error.Network = Ce PC ne peut pas atteindre le réseau de l'hôte.
CS2MP.Error.Network.Help = Vérifiez votre connexion Internet ou locale, puis réessayez. Si vous êtes sur le même réseau, utilisez l'IP locale de l'hôte.
CS2MP.Error.PortInUse = Le port d'hébergement est déjà utilisé par un autre programme.
CS2MP.Error.PortInUse.Help = Fermez l'autre instance d'hébergement ou de jeu, ou choisissez un autre port et communiquez exactement ce port à tous les joueurs.
CS2MP.Error.Removed = L'hôte vous a retiré de cette session multijoueur.
CS2MP.Error.Removed.Help = Demandez à l'hôte avant d'essayer de revenir.
CS2MP.Error.Declined = L'hôte ne vous a pas laissé entrer dans la session.
CS2MP.Error.Declined.Help = L'hôte doit approuver votre arrivée. Demandez-lui de vous laisser entrer, puis réessayez.
CS2MP.Error.Generic = Le multijoueur n'a pas pu établir la connexion.
CS2MP.Error.Generic.Help = Réessayez. Si cela se reproduit, redémarrez les deux jeux, vérifiez l'adresse et le port, et vérifiez que le mod est à jour sur les deux PC.


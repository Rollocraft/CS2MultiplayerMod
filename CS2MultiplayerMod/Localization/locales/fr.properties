# -- General tab --
@label.EnableMod = Activer le mod
@desc.EnableMod = Active ou désactive le mod multijoueur.

@label.PlayerName = Nom du joueur
@desc.PlayerName = Le nom que les autres joueurs voient pour vous.

@label.ShowPartnerMarkers = Afficher les marqueurs des partenaires
@desc.ShowPartnerMarkers = Dessine un anneau coloré à l'endroit que regarde chaque autre joueur, avec une ligne remontant vers sa caméra. Désactivez-le si vous préférez gagner des images par seconde : c'est la seule partie du mod qui dessine à chaque image.

@label.IgnoreModCompatibilityChecks = Ignorer les vérifications de compatibilité des mods (à vos risques)
@desc.IgnoreModCompatibilityChecks = Autorise d'autres mods actifs et, lorsque vous hébergez, des versions différentes de CS2 Multiplayer Mod. Cela peut provoquer des désynchronisations, des villes corrompues ou des plantages. Les vérifications du protocole, de la version du jeu et des DLC restent appliquées. À modifier uniquement hors ligne.

# -- Logging tab --
# One switch per feature. None of them has to be on for a bug report to be worth
# reading: connects, disconnects, world transfers, resyncs, dropped commands and
# every fault are logged whatever is set here. These add the detail underneath.
@group.LogAll = Journalisation complète
@group.LogConnection = Connexion
@group.LogWorld = Monde et synchro
@group.LogEconomy = Économie de la ville
@group.LogClient = Ce client

@label.VerboseLogging = Tout journaliser
@desc.VerboseLogging = Active d'un coup toutes les options ci-dessous. Les connexions, déconnexions, transferts de monde, resynchronisations, actions perdues et toutes les erreurs sont journalisées quoi qu'il arrive - ces options n'ajoutent que le détail en dessous. Activez-la si l'on vous a demandé un journal complet.

@label.LogSession = Journaliser la session
@desc.LogSession = Connexion, déconnexion, la poignée de main, et les joueurs qui arrivent ou partent.
@label.LogTransport = Journaliser la connexion
@desc.LogTransport = Le lien sous la session : sockets, relais Steam, redirection de port et débits d'envoi. Activez-la si la connexion échoue totalement.
@label.LogWorldTransfer = Journaliser le transfert du monde
@desc.LogWorldTransfer = Envoi, réception, sauvegarde et chargement de la ville téléchargée par un joueur qui rejoint. Activez-la si la connexion reste bloquée.

@label.LogResync = Journaliser la resynchronisation
@desc.LogResync = Ce qui différait entre les deux villes, la décision prise par le mod et ce que la réparation a fait. Activez-la si le monde se recharge sans arrêt.
@label.LogPipeline = Journaliser le pipeline de commandes
@desc.LogPipeline = Le trajet de chaque action : mise en file, envoi, réception, application ou abandon. Activez-la si certaines actions arrivent et d'autres non.
@label.LogNets = Journaliser routes et réseaux
@desc.LogNets = Routes, voies, tuyaux et câbles : construction, amélioration, remplacement et raccordements.
@label.LogBuildings = Journaliser bâtiments et objets
@desc.LogBuildings = Les objets posés : bâtiments, accessoires et arbres - poser, déplacer, améliorer et démolir.
@label.LogLand = Journaliser terrain et terres
@desc.LogLand = Zonage, zones et quartiers, modifications du terrain et achats de parcelles.
@label.LogCity = Journaliser l'état de la ville
@desc.LogCity = État global de la ville : noms, décrets, argent, jalons et arbre de développement.
@label.LogRoutes = Journaliser les lignes de transport
@desc.LogRoutes = Lignes de transport, leurs arrêts et véhicules, et le prix des billets.

@label.LogResidential = Journaliser la synchro résidentielle
@desc.LogResidential = Journalise les détails sur les ménages, les habitants et leur logement.
@label.LogCommercial = Journaliser la synchro commerciale
@desc.LogCommercial = Journalise les détails sur les commerces : quelle entreprise loue chaque bâtiment, ses chiffres et son stock.
@label.LogIndustrial = Journaliser la synchro industrielle
@desc.LogIndustrial = Journalise les détails sur les usines et les sites d'extraction : quelle entreprise loue chaque bâtiment, ses chiffres et son stock.
@label.LogOffice = Journaliser la synchro des bureaux
@desc.LogOffice = Journalise les détails sur les bureaux : quelle entreprise loue chaque bâtiment, ses chiffres et son stock.

@label.LogPlayers = Journaliser les autres joueurs
@desc.LogPlayers = Les autres joueurs : leurs curseurs, marqueurs, pings sur la carte et le chat.
@label.LogUi = Journaliser les écrans du mod
@desc.LogUi = Les écrans propres au mod : le bouton du menu principal, la fenêtre pour rejoindre et la page d'options.
@label.LogStartup = Journaliser le démarrage
@desc.LogStartup = Chargement du mod, enregistrement de ses systèmes, et les vérifications de mods et de DLC.
@label.LogPerformance = Journaliser les performances
@desc.LogPerformance = Toutes les 30 secondes, journalise les temps d'image et le temps de thread principal consommé par le mod, réparti entre résidentiel, commercial, industriel et bureaux. C'est ce qui permet de distinguer le coût du mod de celui de la ville.

@label.StatusRole = Rôle
@desc.StatusRole = Indique si cette instance est hors ligne, héberge, ou a rejoint en tant que client.

@label.StatusState = Connexion
@desc.StatusState = État actuel de la connexion ou dernière erreur hors ligne.

@label.StatusPlayers = Joueurs
@desc.StatusPlayers = Joueurs connectés visibles par cette session.

@label.StatusAccess = Accès
@desc.StatusAccess = Indique si rejoindre nécessite le mot de passe du serveur.

@label.StatusExposure = Réseau
@desc.StatusExposure = Indique si l'hôte est limité au réseau local ou accepte les connexions Internet/LAN.

@label.StatusWorld = Monde
@desc.StatusWorld = État actuel de chargement ou d'hébergement du monde de l'hôte.

@label.DisconnectButton = Se déconnecter
@desc.DisconnectButton = Quitte la session en cours et ferme toutes les connexions.

# -- Join tab --
@label.JoinConnection = Connexion
@desc.JoinConnection = Le relais Steam vous connecte à l'hôte avec le code qu'il vous a donné - sans adresse ni port. La connexion directe est la méthode d'origine : saisissez l'adresse et le port de l'hôte. Utilisez ce que l'hôte a choisi.

@label.JoinCodeInput = Code d'accès
@desc.JoinCodeInput = Le code que l'hôte lit sur son écran d'hébergement. Rien d'autre ne doit correspondre.

@label.ServerAddress = Adresse de l'hôte
@desc.ServerAddress = Adresse IP ou nom d'hôte du joueur qui héberge la partie (il la voit dans son journal au démarrage de l'hébergement).

@label.JoinPort = Port
@desc.JoinPort = Port TCP de l'hôte (25001 par défaut). Doit correspondre exactement au port ouvert par l'hôte.

@label.JoinPassword = Mot de passe
@desc.JoinPassword = Le mot de passe du serveur de l'hôte, s'il en a défini un. Il n'est jamais envoyé en clair.

@label.JoinStatus = État
@desc.JoinStatus = État actuel de la connexion. Rejoindre fonctionne depuis le menu principal - la ville est transférée depuis l'hôte.

@label.JoinButton = Rejoindre la session
@desc.JoinButton = Se connecte à l'hôte ci-dessus et télécharge sa ville. Fonctionne depuis le menu principal ; aucune sauvegarde locale nécessaire. Même action que la fenêtre « Rejoindre une partie » du menu principal.

@label.JoinDisconnectButton = Se déconnecter
@desc.JoinDisconnectButton = Quitte la session en cours et ferme toutes les connexions.

# -- Host tab --
@label.HostConnection = Connexion
@desc.HostConnection = Le relais Steam permet à vos amis de vous rejoindre avec votre seul code d'accès - aucun port à ouvrir, aucune configuration de routeur. La connexion directe est la méthode d'origine : elle exige un port redirigé, mais fonctionne sans Steam.

@label.HostJoinCode = Votre code d'accès
@desc.HostJoinCode = Donnez-le à vos amis. Ils le collent dans « Adresse de l'hôte » sur leur écran de connexion et se connectent aussitôt.

@label.HostPort = Port à ouvrir
@desc.HostPort = Port TCP sur lequel votre serveur écoute (1-65535, 25001 par défaut). Les joueurs qui vous rejoignent doivent saisir exactement ce port. Pour jouer via Internet, redirigez ce port TCP sur votre routeur vers ce PC et autorisez-le dans le pare-feu Windows.

@label.HostPassword = Mot de passe du serveur
@desc.HostPassword = Les joueurs doivent le saisir pour rejoindre (il n'est jamais envoyé en clair). Fortement recommandé pour jouer via Internet - sans mot de passe, quiconque trouve le port peut rejoindre et télécharger votre ville.

@label.LanOnly = Réseau local uniquement
@desc.LanOnly = N'accepte que les joueurs de votre réseau local. Désactivé par défaut afin que vos amis puissent rejoindre via Internet (redirection de port requise). Un mot de passe fort est fortement recommandé pour jouer via Internet.

@label.RequireJoinApproval = Approuver les joueurs qui rejoignent
@desc.RequireJoinApproval = Lorsque cette option est activée, chaque joueur qui tente de rejoindre attend pendant que vous recevez une demande d'acceptation ou de refus. Désactivez-la pour admettre automatiquement quiconque passe les vérifications de mot de passe et de version.

@label.MaxPlayers = Joueurs max.
@desc.MaxPlayers = Nombre maximal de joueurs simultanés, vous compris (2-32).

@label.ResyncMinutes = Resynchronisation du monde (minutes)
@desc.ResyncMinutes = Fréquence à laquelle le monde entier est resauvegardé et transféré aux clients pour corriger les écarts. Plus bas = plus cohérent, mais plus de pauses de chargement.

@label.HostStatus = État de l'hébergement
@desc.HostStatus = L'hébergement nécessite une ville chargée : votre ville est le monde dans lequel tout le monde joue.

@label.HostButton = Héberger la session
@desc.HostButton = Ouvre votre ville actuelle comme serveur sur le port ci-dessus. Le journal liste les adresses exactes que les autres joueurs peuvent utiliser. Les joueurs qui se connectent reçoivent la carte automatiquement.

@label.SyncWorldButton = Synchroniser le monde
@desc.SyncWorldButton = Renvoie immédiatement votre ville à tous les joueurs connectés, en remplaçant leur copie. Utilisez ceci pour effacer tout écart entre les joueurs. Identique au bouton « Synchroniser le monde » du panneau multijoueur en jeu - conservé ici comme solution de secours si ce bouton venait à manquer.


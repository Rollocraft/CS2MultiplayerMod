# -- General tab --
@label.ModVersion = Version
@desc.ModVersion = La version du mod utilisée par ce jeu - indiquez-la dans un rapport de bug. Une copie que vous avez compilée vous-même affiche aussi l'heure de sa compilation et le protocole réseau qu'elle emploie.

@label.EnableMod = Activer le mod
@desc.EnableMod = Active ou désactive le mod multijoueur.

@label.PlayerName = Nom du joueur
@desc.PlayerName = Le nom que les autres joueurs voient pour vous.

@label.ShowPartnerMarkers = Afficher les marqueurs des partenaires
@desc.ShowPartnerMarkers = Affiche les rep?res de cam?ra, les contours des objets survol?s et les aper?us simplifi?s de placement des autres joueurs. D?sactivez cette option pour masquer ces ?l?ments.

@label.VerboseLogging = Journalisation détaillée
@desc.VerboseLogging = Ajoute au journal le détail de chaque action. Les connexions, déconnexions, transferts de ville, chaque resynchronisation et ce qui l'a déclenchée, les actions abandonnées, la version du mod, les autres mods actifs et toutes les erreurs sont journalisés même sans cette option. Activez-la si l'on vous demande un journal complet - le journal s'allonge, le jeu ne ralentit pas.

@label.ExportDiagnosticsButton = Enregistrer les diagnostics
@desc.ExportDiagnosticsButton = Écrit un fichier contenant l'état actuel de la session et le CS2MP-flight.log du mod dans le dossier Logs du jeu, prêt à être joint à un rapport de bug. Pendant une session, /diag dans le chat multijoueur fait la même chose.

@label.DiagnosticsStatus = Fichier de diagnostic
@desc.DiagnosticsStatus = Le dernier fichier écrit par Enregistrer les diagnostics, dans le dossier Logs du jeu. Relisez-le avant de le publier.

# -- Actions de session (onglet Général) --
@label.DisconnectButton = Se déconnecter
@desc.DisconnectButton = Quitter la session - ou la fermer si vous êtes l'hôte - et couper toutes les connexions.

# -- Join tab --
@label.JoinConnection = Connexion
@desc.JoinConnection = Le relais Steam vous connecte à l'hôte avec le code qu'il vous a donné - sans adresse ni port. La connexion directe est la méthode d'origine : saisissez l'adresse et le port de l'hôte. Utilisez ce que l'hôte a choisi.

@label.JoinCodeInput = Code d'accès
@desc.JoinCodeInput = Le code que l'hôte lit sur son écran d'hébergement. Rien d'autre ne doit correspondre.

@label.ServerAddress = Adresse de l'hôte
@desc.ServerAddress = Adresse IP ou nom d'hôte du joueur qui héberge la partie (il la voit dans son journal au démarrage de l'hébergement).

@label.JoinPort = Port
@desc.JoinPort = Port TCP de l'hôte (25001 par défaut). Doit correspondre exactement au port ouvert par l'hôte.

@label.JoinPassword = Mot de passe
@desc.JoinPassword = Le mot de passe du serveur de l'hôte, s'il en a défini un. Il n'est jamais envoyé en clair.

@label.JoinStatus = État
@desc.JoinStatus = État actuel de la connexion. Rejoindre fonctionne depuis le menu principal - la ville est transférée depuis l'hôte.

@label.JoinButton = Rejoindre la session
@desc.JoinButton = Se connecte à l'hôte ci-dessus et télécharge sa ville. Fonctionne depuis le menu principal ; aucune sauvegarde locale nécessaire. Même action que la fenêtre « Rejoindre une partie » du menu principal.

@label.JoinDisconnectButton = Se déconnecter
@desc.JoinDisconnectButton = Quitte la session en cours et ferme toutes les connexions.

# -- Host tab --
@label.HostConnection = Connexion
@desc.HostConnection = Le relais Steam permet à vos amis de vous rejoindre avec votre seul code d'accès - aucun port à ouvrir, aucune configuration de routeur. La connexion directe est la méthode d'origine : elle exige un port redirigé, mais fonctionne sans Steam.

@label.HostJoinCode = Votre code d'accès
@desc.HostJoinCode = Donnez-le à vos amis. Ils le collent dans « Adresse de l'hôte » sur leur écran de connexion et se connectent aussitôt.

@label.HostPort = Port à ouvrir
@desc.HostPort = Port TCP sur lequel votre serveur écoute (1-65535, 25001 par défaut). Les joueurs qui vous rejoignent doivent saisir exactement ce port. Pour jouer via Internet, redirigez ce port TCP sur votre routeur vers ce PC et autorisez-le dans le pare-feu Windows.

@label.HostPassword = Mot de passe du serveur
@desc.HostPassword = Les joueurs doivent le saisir pour rejoindre (il n'est jamais envoyé en clair). Obligatoire pour héberger en connexion directe via Internet : au moins 8 caractères, sinon quiconque trouve le port pourrait rejoindre et télécharger votre ville. Le relais Steam et le mode Réseau local uniquement n'en ont pas besoin.

@label.LanOnly = Réseau local uniquement
@desc.LanOnly = N'accepte que les joueurs de votre réseau local. Désactivé par défaut afin que vos amis puissent rejoindre via Internet (cela nécessite la redirection de port et un mot de passe du serveur d'au moins 8 caractères).

@label.RequireJoinApproval = Approuver les joueurs qui rejoignent
@desc.RequireJoinApproval = Lorsque cette option est activée, chaque joueur qui tente de rejoindre attend pendant que vous recevez une demande d'acceptation ou de refus. Désactivez-la pour admettre automatiquement quiconque passe les vérifications de mot de passe et de version.

@label.AutoApproveSteamFriends = Approuver automatiquement les amis Steam
@desc.AutoApproveSteamFriends = Lorsque l'approbation des joueurs est activée, les amis Steam authentifiés rejoignent immédiatement. Tous les autres attendent toujours votre approbation. Steam Relay uniquement.

@label.ResyncPolicy = Demandes de resynchronisation des clients
@desc.ResyncPolicy = Autorisez immédiatement les demandes de synchronisation du monde, demandez votre approbation avant de les lancer ou réservez-les à l'hôte. Les demandes de récupération automatique suivent la même règle.

@label.MaxPlayers = Joueurs max.
@desc.MaxPlayers = Nombre maximal de joueurs simultanés, vous compris (2-32).


@label.HostStatus = État de l'hébergement
@desc.HostStatus = L'hébergement nécessite une ville chargée : votre ville est le monde dans lequel tout le monde joue.

@label.HostButton = Héberger la session
@desc.HostButton = Ouvre votre ville actuelle comme serveur sur le port ci-dessus. Le journal liste les adresses exactes que les autres joueurs peuvent utiliser. Les joueurs qui se connectent reçoivent la carte automatiquement.

@label.SyncWorldButton = Synchroniser le monde
@desc.SyncWorldButton = Renvoie immédiatement votre ville à tous les joueurs connectés, en remplaçant leur copie. Utilisez ceci pour effacer tout écart entre les joueurs. Identique au bouton « Synchroniser le monde » du panneau multijoueur en jeu - conservé ici comme solution de secours si ce bouton venait à manquer.

# -- Onglet Avancé --
@label.IgnoreModCompatibilityChecks = Ignorer les vérifications de compatibilité des mods (à vos risques)
@desc.IgnoreModCompatibilityChecks = Autorise d'autres mods actifs et, lorsque vous hébergez, des versions différentes de CS2 Multiplayer Mod. Cela peut provoquer des désynchronisations, des villes corrompues ou des plantages. Les vérifications du protocole, de la version du jeu et des DLC restent appliquées. À modifier uniquement hors ligne.


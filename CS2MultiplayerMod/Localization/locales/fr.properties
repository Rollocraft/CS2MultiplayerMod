# CS2 Multiplayer Mod - French locale (fr-FR)
#
# ============================ Options screen ============================
@settings = Mod Multijoueur CS2

@tab.General = Général
@tab.Join = Rejoindre
@tab.Host = Héberger

@group.General = Général
@group.Status = État
@group.Session = Actions de session
@group.JoinSetup = Serveur à rejoindre
@group.JoinAction = Rejoindre
@group.HostSetup = Paramètres du serveur
@group.HostAction = Démarrer l'hébergement

# -- Onglet Général --
@label.EnableMod = Activer le mod
@desc.EnableMod = Active ou désactive le mod multijoueur.

@label.PlayerName = Nom du joueur
@desc.PlayerName = Le nom que les autres joueurs verront pour vous.

@label.VerboseLogging = Journalisation détaillée
@desc.VerboseLogging = Enregistre des détails supplémentaires pour le dépannage.

@label.StatusRole = Rôle
@desc.StatusRole = Indique si cette instance est hors ligne, hôte ou cliente.

@label.StatusState = Connexion
@desc.StatusState = État actuel de la connexion ou dernière erreur.

@label.StatusPlayers = Joueurs
@desc.StatusPlayers = Joueurs connectés à cette session.

@label.StatusAccess = Accès
@desc.StatusAccess = Indique si un mot de passe est requis.

@label.StatusExposure = Réseau
@desc.StatusExposure = Indique si l'hôte est en LAN ou accepte Internet/LAN.

@label.StatusWorld = Monde
@desc.StatusWorld = État de chargement ou d'hébergement de la ville.

@label.DisconnectButton = Déconnecter
@desc.DisconnectButton = Quitte la session et ferme toutes les connexions.

# -- Onglet Rejoindre --
@label.JoinConnection = Connexion
@desc.JoinConnection = Choisissez Steam Relay ou Connexion Directe.

@label.JoinCodeInput = Code d'accès
@desc.JoinCodeInput = Le code fourni par l'hôte.

@label.ServerAddress = Adresse de l'hôte
@desc.ServerAddress = Adresse IP ou nom d'hôte du serveur.

@label.JoinPort = Port
@desc.JoinPort = Port TCP de l'hôte (par défaut 25001).

@label.JoinPassword = Mot de passe
@desc.JoinPassword = Mot de passe du serveur si défini.

@label.JoinStatus = État
@desc.JoinStatus = État de connexion actuel.

@label.JoinButton = Rejoindre la session
@desc.JoinButton = Se connecter à l'hôte et télécharger sa ville.

@label.JoinDisconnectButton = Déconnecter
@desc.JoinDisconnectButton = Quitter la session actuelle.

# -- Onglet Héberger --
@label.HostConnection = Connexion
@desc.HostConnection = Type de connexion pour l'hébergement.

@label.HostJoinCode = Votre code d'accès
@desc.HostJoinCode = Donnez ce code à vos amis pour rejoindre via Steam Relay.

@label.HostPort = Port à ouvrir
@desc.HostPort = Port TCP d'écoute du serveur (1-65535, défaut 25001).

@label.HostPassword = Mot de passe du serveur
@desc.HostPassword = Mot de passe requis pour rejoindre.

@label.HostMaxPlayers = Joueurs max
@desc.HostMaxPlayers = Nombre maximal de joueurs simultanés (2-16).

@label.HostLanOnly = Réseau local (LAN) uniquement
@desc.HostLanOnly = Limite l'hébergement au réseau local.

@label.HostAutoSyncMinutes = Intervalle de synchronisation (min)
@desc.HostAutoSyncMinutes = Intervalle entre les synchronisations complètes de sauvegarde (0 pour désactiver).

@label.HostStatus = État
@desc.HostStatus = État de l'hébergement.

@label.HostButton = Démarrer l'hébergement
@desc.HostButton = Ouvrir la ville actuelle aux joueurs connectés.

@label.HostStopButton = Arrêter l'hébergement
@desc.HostStopButton = Fermer la session multijoueur.

@label.HostSaveRecoveryButton = Sauvegarder la ville partagée
@desc.HostSaveRecoveryButton = Sauvegarder la ville actuelle.


# -- Aba Geral --
@label.EnableMod = Ativar Mod
@desc.EnableMod = Ativa ou desativa o mod multijogador.

@label.PlayerName = Nome do Jogador
@desc.PlayerName = O nome que os outros jogadores verão para você.

@label.VerboseLogging = Registro Detalhado
@desc.VerboseLogging = Registra informações extras para diagnóstico de problemas.

@label.StatusRole = Função
@desc.StatusRole = Mostra se esta instância está desconectada, host ou cliente.

@label.StatusState = Conexão
@desc.StatusState = Status atual da conexão ou último erro.

@label.StatusPlayers = Jogadores
@desc.StatusPlayers = Jogadores conectados a esta sessão.

@label.StatusAccess = Acesso
@desc.StatusAccess = Indica se uma senha é necessária.

@label.StatusExposure = Rede
@desc.StatusExposure = Indica se está em LAN apenas ou público para Internet/LAN.

@label.StatusWorld = Mundo
@desc.StatusWorld = Estado de carregamento ou hospedagem da cidade.

@label.DisconnectButton = Desconectar
@desc.DisconnectButton = Sai da sessão e fecha todas as conexões.

# -- Aba Entrar --
@label.JoinConnection = Conexão
@desc.JoinConnection = Escolha Steam Relay ou Conexão Direta.

@label.JoinCodeInput = Código de Acesso
@desc.JoinCodeInput = O código fornecido pelo host.

@label.ServerAddress = Endereço do Host
@desc.ServerAddress = Endereço IP ou nome de host do servidor.

@label.JoinPort = Porta
@desc.JoinPort = Porta TCP do host (padrão: 25001).

@label.JoinPassword = Senha
@desc.JoinPassword = Senha do servidor (se definida).

@label.JoinStatus = Status
@desc.JoinStatus = Status atual da conexão.

@label.JoinButton = Entrar na Sessão
@desc.JoinButton = Conectar ao host e baixar os dados da cidade.

@label.JoinDisconnectButton = Desconectar
@desc.JoinDisconnectButton = Sair da sessão atual.

# -- Aba Hospedar --
@label.HostConnection = Conexão
@desc.HostConnection = Tipo de conexão para hospedagem.

@label.HostJoinCode = Seu Código de Acesso
@desc.HostJoinCode = Compartilhe este código com seus amigos para entrarem via Steam Relay.

@label.HostPort = Porta para Abrir
@desc.HostPort = Porta TCP de escuta (1-65535, padrão: 25001).

@label.HostPassword = Senha do Servidor
@desc.HostPassword = Senha necessária para entrar.

@label.HostMaxPlayers = Máx. de Jogadores
@desc.HostMaxPlayers = Número máximo de jogadores simultâneos (2-16).

@label.HostLanOnly = Apenas Rede Local (LAN)
@desc.HostLanOnly = Limita a sessão apenas a jogadores na mesma rede local.

@label.HostAutoSyncMinutes = Intervalo de Sincronização (min)
@desc.HostAutoSyncMinutes = Intervalo entre sincronizações completas de save (0 para desativar).

@label.HostStatus = Status
@desc.HostStatus = Estado de hospedagem.

@label.HostButton = Iniciar Hospedagem
@desc.HostButton = Abrir a cidade atual para outros jogadores entrarem.

@label.HostStopButton = Parar Hospedagem
@desc.HostStopButton = Encerrar a sessão multijogador.

@label.HostSaveRecoveryButton = Salvar Cidade Compartilhada
@desc.HostSaveRecoveryButton = Salvar os dados atuais da cidade.


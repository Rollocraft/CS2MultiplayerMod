# -- General tab --
@label.ModVersion = 版本
@desc.ModVersion = 本游戏正在运行的模组版本——报告问题时请一并提供。自行编译的副本还会显示编译时间和它使用的网络协议。

@label.EnableMod = 启用模组
@desc.EnableMod = 打开或关闭多人游戏模组。

@label.PlayerName = 玩家名称
@desc.PlayerName = 其他玩家看到的你的名称。

@label.ShowPartnerMarkers = 显示伙伴标记
@desc.ShowPartnerMarkers = ??????????????????????????????????????????????

@label.VerboseLogging = 详细日志
@desc.VerboseLogging = 在日志中加入每个操作的细节。连接、断开、城市传输、每次重新同步及其触发原因、被丢弃的操作、模组版本、还有哪些模组处于启用状态以及所有错误，即使关闭此选项也会记录。当有人要求你提供完整日志时再打开它：日志会变长，但游戏不会变慢。

@label.ExportDiagnosticsButton = 保存诊断信息
@desc.ExportDiagnosticsButton = 将当前会话状态和模组的 CS2MP-flight.log 写入游戏 Logs 文件夹中的一个文件，可直接附在错误报告中。会话中在多人聊天里输入 /diag 效果相同。

@label.DiagnosticsStatus = 诊断文件
@desc.DiagnosticsStatus = “保存诊断信息”最近写入的文件，位于游戏 Logs 文件夹中。公开分享前请先检查内容。

# -- 会话操作（常规选项卡） --
@label.DisconnectButton = 断开连接
@desc.DisconnectButton = 离开会话（若你是主机则关闭会话），并断开所有连接。

# -- Join tab --
@label.JoinConnection = 连接方式
@desc.JoinConnection = Steam 中继只需主机给你的代码即可连接，无需地址和端口。直接连接是原本的方式：输入主机的地址和端口。请使用主机所选的方式。

@label.JoinCodeInput = 加入代码
@desc.JoinCodeInput = 主机在其主持界面上看到的代码。除此之外无需匹配任何内容。

@label.ServerAddress = 主机地址
@desc.ServerAddress = 主持游戏的玩家的 IP 地址或主机名（开始主持时会显示在他们的日志中）。

@label.JoinPort = 端口
@desc.JoinPort = 主机的 TCP 端口（默认 25001）。必须与主机开放的端口完全一致。

@label.JoinPassword = 密码
@desc.JoinPassword = 主机设置的服务器密码（如果有）。密码绝不会以明文发送。

@label.JoinStatus = 状态
@desc.JoinStatus = 当前连接状态。可以从主菜单加入，城市会从主机传输过来。

@label.JoinButton = 加入会话
@desc.JoinButton = 连接到上方的主机并下载其城市。可从主菜单使用，无需本地存档。与主菜单中的“加入游戏”对话框效果相同。

@label.JoinDisconnectButton = 断开连接
@desc.JoinDisconnectButton = 离开当前会话并关闭所有连接。

# -- Host tab --
@label.HostConnection = 连接方式
@desc.HostConnection = 使用 Steam 中继时，好友只需你的加入代码即可加入，无需开放端口，也无需设置路由器。直接连接是原本的方式：需要端口转发，但不依赖 Steam。

@label.HostJoinCode = 你的加入代码
@desc.HostJoinCode = 把它发给好友。他们在加入界面的“主机地址”中粘贴，即可直接连接。

@label.HostPort = 要开放的端口
@desc.HostPort = 服务器监听的 TCP 端口（1-65535，默认 25001）。加入的玩家必须填写完全相同的端口。若要通过互联网游玩，请在路由器上把该 TCP 端口转发到本机，并在 Windows 防火墙中放行。

@label.HostPassword = 服务器密码
@desc.HostPassword = 玩家必须输入它才能加入（绝不会以明文发送）。通过互联网以直接连接方式主持时必须设置，且至少 8 个字符，否则任何找到该端口的人都能加入并下载你的城市。Steam 中继和仅限局域网模式不需要密码。

@label.LanOnly = 仅限局域网
@desc.LanOnly = 只接受来自本地网络的玩家。默认关闭，以便好友通过互联网加入（这需要端口转发，以及至少 8 个字符的服务器密码）。

@label.RequireJoinApproval = 审批加入的玩家
@desc.RequireJoinApproval = 开启后，每位尝试加入的玩家都会等待，同时你会收到接受或拒绝的提示。关闭则自动放行所有通过密码和版本检查的玩家。

@label.AutoApproveSteamFriends = 自动批准 Steam 好友
@desc.AutoApproveSteamFriends = 启用玩家审批时，已验证的 Steam 好友可立即加入。其他玩家仍需等待你的批准。仅适用于 Steam 中继。

@label.ResyncPolicy = 客户端重新同步请求
@desc.ResyncPolicy = 立即允许客户端的世界同步请求、开始前询问你，或仅允许主机发起同步。客户端的自动恢复请求遵循相同规则。

@label.MaxPlayers = 最大玩家数
@desc.MaxPlayers = 包含你在内的同时在线玩家上限（2-32）。


@label.HostStatus = 主持状态
@desc.HostStatus = 主持需要已加载的城市：你的城市就是大家共同游玩的世界。

@label.HostButton = 主持会话
@desc.HostButton = 以上方端口将当前城市作为服务器开放。日志中会列出其他玩家可用的确切地址。连接进来的玩家会自动收到地图。

@label.SyncWorldButton = 同步世界
@desc.SyncWorldButton = 立即把你的城市重新发送给所有已连接玩家，替换他们的副本。用它来消除玩家之间的偏差。与游戏内多人面板的“同步世界”按钮相同，这里保留作为该按钮缺失时的备用入口。

# -- 高级选项卡 --
@label.IgnoreModCompatibilityChecks = 忽略模组兼容性检查（风险自负）
@desc.IgnoreModCompatibilityChecks = 允许启用其他模组，并且在你主持游戏时允许不同版本的 CS2 Multiplayer Mod。这可能导致不同步、城市损坏或游戏崩溃。协议、游戏版本和 DLC 检查仍会执行。请仅在离线时更改。


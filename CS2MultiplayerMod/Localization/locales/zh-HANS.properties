@tab.Host = 创建游戏
@tab.Logging = 日志

@group.General = 常规
@group.Status = 状态
@group.Session = 会话操作
@group.JoinSetup = 要加入的服务器
@group.JoinAction = 加入
@group.HostSetup = 服务器设置
@group.HostAction = 开始主持

# -- General tab --
@label.EnableMod = 启用模组
@desc.EnableMod = 打开或关闭多人游戏模组。

@label.PlayerName = 玩家名称
@desc.PlayerName = 其他玩家看到的你的名称。

@label.ShowPartnerMarkers = 显示伙伴标记
@desc.ShowPartnerMarkers = 在每位其他玩家注视的位置绘制一个彩色圆环，并用一条线连到他们的摄像机。如果你更看重帧数，可以关闭它：这是本模组唯一每帧绘制的部分。

@label.IgnoreModCompatibilityChecks = 忽略模组兼容性检查（风险自负）
@desc.IgnoreModCompatibilityChecks = 允许启用其他模组，并且在你主持游戏时允许不同版本的 CS2 Multiplayer Mod。这可能导致不同步、城市损坏或游戏崩溃。协议、游戏版本和 DLC 检查仍会执行。请仅在离线时更改。

# -- Logging tab --
# One switch per feature. None of them has to be on for a bug report to be worth
# reading: connects, disconnects, world transfers, resyncs, dropped commands and
# every fault are logged whatever is set here. These add the detail underneath.
@group.LogAll = 全部日志
@group.LogConnection = 连接
@group.LogWorld = 世界与同步
@group.LogEconomy = 城市经济
@group.LogClient = 本客户端

@label.VerboseLogging = 记录全部
@desc.VerboseLogging = 一次性打开下面所有开关。无论这里如何设置，连接、断开、世界传输、重新同步、被丢弃的操作以及所有故障都会被记录；这些开关只是补充其下的细节。当别人向你索要完整日志时打开它。

@label.LogSession = 记录会话
@desc.LogSession = 连接、断开、握手，以及玩家的加入和离开。
@label.LogTransport = 记录连接
@desc.LogTransport = 会话之下的链路：套接字、Steam 中继、端口转发和发送速率。完全无法连接时打开。
@label.LogWorldTransfer = 记录世界传输
@desc.LogWorldTransfer = 加入的玩家所下载城市的发送、接收、保存与载入。加入卡住时打开。

@label.LogResync = 记录重新同步
@desc.LogResync = 两座城市有何差异、模组如何判断、修复做了什么。世界反复重新载入时打开。
@label.LogPipeline = 记录指令流水线
@desc.LogPipeline = 每个操作的去向：排队、发送、接收、应用或丢弃。部分操作到达而另一些没有时打开。
@label.LogNets = 记录道路与管网
@desc.LogNets = 道路、轨道、管道和电线：铺设、升级、替换及其连接。
@label.LogBuildings = 记录建筑与物件
@desc.LogBuildings = 放置的东西：建筑、装饰和树木的放置、移动、升级与拆除。
@label.LogLand = 记录土地与地形
@desc.LogLand = 分区、区域与街区、地形编辑和地块购买。
@label.LogCity = 记录城市状态
@desc.LogCity = 全城状态：名称、政策、资金、里程碑和发展树。
@label.LogRoutes = 记录交通线路
@desc.LogRoutes = 交通线路、站点与车辆，以及票价。

@label.LogResidential = 记录住宅同步
@desc.LogResidential = 记录家庭、居民以及谁住在哪里的详细信息。
@label.LogCommercial = 记录商业同步
@desc.LogCommercial = 记录商店的详细信息：哪家企业租用该建筑、其财务数据和库存。
@label.LogIndustrial = 记录工业同步
@desc.LogIndustrial = 记录工厂和采掘设施的详细信息：哪家企业租用该建筑、其财务数据和库存。
@label.LogOffice = 记录办公同步
@desc.LogOffice = 记录办公楼的详细信息：哪家企业租用该建筑、其财务数据和库存。

@label.LogPlayers = 记录其他玩家
@desc.LogPlayers = 其他玩家：他们的光标、标记、地图标点和聊天。
@label.LogUi = 记录模组界面
@desc.LogUi = 模组自己的界面：主菜单按钮、加入对话框和选项页面。
@label.LogStartup = 记录启动
@desc.LogStartup = 模组载入、系统注册，以及模组和 DLC 兼容性检查。
@label.LogPerformance = 记录性能
@desc.LogPerformance = 每 30 秒记录一次帧时间，以及模组自身占用的主线程时间，并按住宅、商业、工业和办公分别列出。这样才能把模组的开销与城市本身的开销区分开。

@label.StatusRole = 角色
@desc.StatusRole = 此实例当前处于离线、主持中，还是以客户端身份加入。

@label.StatusState = 连接
@desc.StatusState = 当前连接状态，或离线时的最后一次错误。

@label.StatusPlayers = 玩家
@desc.StatusPlayers = 本会话可见的已连接玩家。

@label.StatusAccess = 访问
@desc.StatusAccess = 加入时是否需要服务器密码。

@label.StatusExposure = 网络
@desc.StatusExposure = 主机是否仅限局域网，或同时接受来自互联网／局域网的连接。

@label.StatusWorld = 世界
@desc.StatusWorld = 主机世界当前的加载或主持状态。

@label.DisconnectButton = 断开连接
@desc.DisconnectButton = 离开当前会话并关闭所有连接。

# -- Join tab --
@label.JoinConnection = 连接方式
@desc.JoinConnection = Steam 中继只需主机给你的代码即可连接，无需地址和端口。直接连接是原本的方式：输入主机的地址和端口。请使用主机所选的方式。

@label.JoinCodeInput = 加入代码
@desc.JoinCodeInput = 主机在其主持界面上看到的代码。除此之外无需匹配任何内容。

@label.ServerAddress = 主机地址
@desc.ServerAddress = 主持游戏的玩家的 IP 地址或主机名（开始主持时会显示在他们的日志中）。

@label.JoinPort = 端口
@desc.JoinPort = 主机的 TCP 端口（默认 25001）。必须与主机开放的端口完全一致。

@label.JoinPassword = 密码
@desc.JoinPassword = 主机设置的服务器密码（如果有）。密码绝不会以明文发送。

@label.JoinStatus = 状态
@desc.JoinStatus = 当前连接状态。可以从主菜单加入，城市会从主机传输过来。

@label.JoinButton = 加入会话
@desc.JoinButton = 连接到上方的主机并下载其城市。可从主菜单使用，无需本地存档。与主菜单中的“加入游戏”对话框效果相同。

@label.JoinDisconnectButton = 断开连接
@desc.JoinDisconnectButton = 离开当前会话并关闭所有连接。

# -- Host tab --
@label.HostConnection = 连接方式
@desc.HostConnection = 使用 Steam 中继时，好友只需你的加入代码即可加入，无需开放端口，也无需设置路由器。直接连接是原本的方式：需要端口转发，但不依赖 Steam。

@label.HostJoinCode = 你的加入代码
@desc.HostJoinCode = 把它发给好友。他们在加入界面的“主机地址”中粘贴，即可直接连接。

@label.HostPort = 要开放的端口
@desc.HostPort = 服务器监听的 TCP 端口（1-65535，默认 25001）。加入的玩家必须填写完全相同的端口。若要通过互联网游玩，请在路由器上把该 TCP 端口转发到本机，并在 Windows 防火墙中放行。

@label.HostPassword = 服务器密码
@desc.HostPassword = 玩家必须输入它才能加入（绝不会以明文发送）。通过互联网游玩时强烈建议设置：不设密码时，任何找到该端口的人都能加入并下载你的城市。

@label.LanOnly = 仅限局域网
@desc.LanOnly = 只接受来自本地网络的玩家。默认关闭，以便好友通过互联网加入（需要端口转发）。通过互联网游玩时强烈建议设置高强度密码。

@label.RequireJoinApproval = 审批加入的玩家
@desc.RequireJoinApproval = 开启后，每位尝试加入的玩家都会等待，同时你会收到接受或拒绝的提示。关闭则自动放行所有通过密码和版本检查的玩家。

@label.MaxPlayers = 最大玩家数
@desc.MaxPlayers = 包含你在内的同时在线玩家上限（2-32）。

@label.ResyncMinutes = 世界重新同步（分钟）
@desc.ResyncMinutes = 每隔多久重新保存整个世界并推送给客户端，以修正任何偏差。数值越小越一致，但加载中断也越多。

@label.HostStatus = 主持状态
@desc.HostStatus = 主持需要已加载的城市：你的城市就是大家共同游玩的世界。

@label.HostButton = 主持会话
@desc.HostButton = 以上方端口将当前城市作为服务器开放。日志中会列出其他玩家可用的确切地址。连接进来的玩家会自动收到地图。

@label.SyncWorldButton = 同步世界
@desc.SyncWorldButton = 立即把你的城市重新发送给所有已连接玩家，替换他们的副本。用它来消除玩家之间的偏差。与游戏内多人面板的“同步世界”按钮相同，这里保留作为该按钮缺失时的备用入口。


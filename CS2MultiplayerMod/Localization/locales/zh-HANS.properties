CS2MP.Error.Dlc = 主机与该玩家已启用的 DLC 不一致。
CS2MP.Error.Dlc.Help = 在两台电脑上启用相同的 DLC，重启游戏后再试。
CS2MP.Error.Mods = 已启用其他模组。
CS2MP.Error.Mods.Help = 多人游戏不支持其他模组。请在当前启用的游戏组合中禁用除 CS2 Multiplayer Mod 以外的所有模组，然后重启游戏。
CS2MP.Error.Full = 该多人会话已满。
CS2MP.Error.Full.Help = 请主机提高“最大玩家数”，或等待其他玩家离开。
CS2MP.Error.Address = 找不到主机地址。
CS2MP.Error.Address.Help = 检查地址是否有输入错误。在同一家庭网络中，请使用主机电脑的本地 IP 地址。
CS2MP.Error.Refused = 主机电脑有响应，但该端口上没有多人会话在监听。
CS2MP.Error.Refused.Help = 确认主机已点击“主持会话”，且双方玩家填写了相同的端口。
CS2MP.Error.Timeout = 主机未在规定时间内响应。
CS2MP.Error.Timeout.Help = 确认主机仍然在线，核对地址和端口，并在主机的防火墙中放行该端口。通过互联网游玩还需要 TCP 端口转发。
CS2MP.Error.Network = 本机无法访问主机所在的网络。
CS2MP.Error.Network.Help = 检查你的互联网或局域网连接，然后重试。如果处于同一网络，请使用主机的本地 IP。
CS2MP.Error.PortInUse = 主持端口已被其他程序占用。
CS2MP.Error.PortInUse.Help = 关闭另一个主机／游戏实例，或改用其他端口，并把同一个端口告诉所有玩家。
CS2MP.Error.Removed = 主机已把你移出该多人会话。
CS2MP.Error.Removed.Help = 再次尝试加入前，请先与主机确认。
CS2MP.Error.Declined = 主机没有让你进入该会话。
CS2MP.Error.Declined.Help = 加入需要主机批准。请他们放行后再试一次。
CS2MP.Error.Generic = 多人游戏未能完成连接。
CS2MP.Error.Generic.Help = 请再试一次。若反复出现，请重启双方游戏，核对地址和端口，并确认两台电脑上的模组均已更新。

# ===================== Host tab state line =====================
CS2MP.Host.LoadCityFirst = 选择“多人游戏 > 创建游戏”来加载或新建城市，或在主持前照常加载一个城市。
CS2MP.Host.Ready = 已准备好主持当前城市。
CS2MP.Host.SessionActive = 多人会话已在进行中。

# ===================== Connection mode =====================
CS2MP.Connection.Relay = Steam 中继
CS2MP.Connection.Direct = 直接连接
CS2MP.Connection.Mode = 连接方式
CS2MP.Connection.JoinCode = 加入代码
CS2MP.Connection.JoinCodeUnavailable = 不可用 - 请通过 Steam 启动游戏
CS2MP.Connection.JoinCodeHint = 把这个代码发给好友。他们在加入界面选择 Steam 中继并输入代码即可，无需其他设置。
CS2MP.Connection.JoinCodeSelectHint = 点击代码将其选中，然后按 Ctrl+C。
CS2MP.Connection.JoinCodeEntry = 加入代码
CS2MP.Connection.JoinCodeEntryHint = 粘贴主机给你的代码。
CS2MP.Connection.RelayHint = 好友使用你的代码加入。无需端口转发，也无需设置路由器。
CS2MP.Connection.DirectHint = 玩家连接到你的地址和端口。需要在路由器上转发该端口。
CS2MP.Connection.RelayUnavailableHint = Steam 当前不可用，因此无法启动中继主持。请改用直接连接，或通过 Steam 启动游戏。

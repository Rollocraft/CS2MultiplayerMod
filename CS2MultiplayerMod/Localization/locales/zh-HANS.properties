# CS2 Multiplayer Mod - Simplified Chinese locale (zh-HANS)
#
# ============================ Options screen ============================
@settings = CS2 联机多人 Mod

@tab.General = 通用
@tab.Join = 加入游戏
@tab.Host = 创建房间

@group.General = 通用
@group.Status = 状态
@group.Session = 会话操作
@group.JoinSetup = 目标服务器
@group.JoinAction = 加入
@group.HostSetup = 服务器设置
@group.HostAction = 开始主持

# -- 通用标签 --
@label.EnableMod = 启用 Mod
@desc.EnableMod = 开启或关闭多人联机模组。

@label.PlayerName = 玩家名称
@desc.PlayerName = 其他玩家看到您的昵称。

@label.VerboseLogging = 详细日志
@desc.VerboseLogging = 记录详细调试信息以便排查网络与同步问题。

@label.StatusRole = 角色
@desc.StatusRole = 当前状态为离线、房主或客户端。

@label.StatusState = 连接状态
@desc.StatusState = 当前网络连接状态或故障原因。

@label.StatusPlayers = 在线玩家
@desc.StatusPlayers = 当前房间内连接的玩家列表。

@label.StatusAccess = 访问权限
@desc.StatusAccess = 加入此房间是否需要密码。

@label.StatusExposure = 网络类型
@desc.StatusExposure = 仅局域网或允许外网连接。

@label.StatusWorld = 地图状态
@desc.StatusWorld = 城市地图加载与同步状态。

@label.DisconnectButton = 断开连接
@desc.DisconnectButton = 退出当前房间并断开所有连接。

# -- 加入游戏 --
@label.JoinConnection = 连接方式
@desc.JoinConnection = 支持 Steam 中继代码连接或 IP 直连。

@label.JoinCodeInput = 房间邀请码
@desc.JoinCodeInput = 房主提供的 Steam 中继房间码。

@label.ServerAddress = 房主 IP 地址
@desc.ServerAddress = 房主电脑的 IP 地址或域名。

@label.JoinPort = 端口
@desc.JoinPort = 房主开放的 TCP 端口 (默认 25001)。

@label.JoinPassword = 房间密码
@desc.JoinPassword = 房主设置的服务器访问密码。

@label.JoinStatus = 连接状态
@desc.JoinStatus = 当前加入流程状态。

@label.JoinButton = 加入房间
@desc.JoinButton = 连接至房主并下载城市存档。

@label.JoinDisconnectButton = 断开连接
@desc.JoinDisconnectButton = 退出当前联机会话。

# -- 创建房间 --
@label.HostConnection = 连接方式
@desc.HostConnection = 选择 Steam 中继或 IP 端口直连。

@label.HostJoinCode = 您的房间邀请码
@desc.HostJoinCode = 将此代码发送给好友，对方直接输入即可加入，无需端口映射。

@label.HostPort = 监听端口
@desc.HostPort = 服务器监听端口 (1-65535, 默认 25001)。

@label.HostPassword = 房间密码
@desc.HostPassword = 好友加入时需要输入的访问密码。

@label.HostMaxPlayers = 最大人数
@desc.HostMaxPlayers = 房间允许的最大玩家数量 (2-16)。

@label.HostLanOnly = 仅限局域网 (LAN)
@desc.HostLanOnly = 仅允许同一局域网下的设备加入。

@label.HostAutoSyncMinutes = 自动全量同步间隔 (分钟)
@desc.HostAutoSyncMinutes = 完整备份同步周期 (0 为关闭)。

@label.HostStatus = 主持状态
@desc.HostStatus = 当前服务器状态。

@label.HostButton = 开启联机房间
@desc.HostButton = 将当前城市开放给联机好友。

@label.HostStopButton = 关闭联机房间
@desc.HostStopButton = 结束当前多人游戏会话。

@label.HostSaveRecoveryButton = 保存共享城市存档
@desc.HostSaveRecoveryButton = 立即保存一份当前城市的本地备份。


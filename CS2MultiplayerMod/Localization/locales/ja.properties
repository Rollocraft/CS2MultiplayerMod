CS2MP.Connection.Relay = Steamリレー
CS2MP.Connection.Direct = 直接接続
CS2MP.Connection.Mode = 接続方法
CS2MP.Connection.JoinCode = 参加コード
CS2MP.Connection.JoinCodeUnavailable = 利用できません - Steam経由でゲームを起動してください
CS2MP.Connection.JoinCodeHint = このコードをフレンドに送ってください。フレンドは参加画面でSteamリレーを選び、コードを入力するだけです。ほかに設定は必要ありません。
CS2MP.Connection.JoinCodeSelectHint = コードをクリックして選択し、Ctrl+Cを押してください。

CS2MP.Error.Dlc.Help = 双方のPCで同じDLCを有効にし、ゲームを再起動してからもう一度お試しください。
CS2MP.Error.Mods = 他のMODが有効になっています。
CS2MP.Error.Mods.Help = マルチプレイは他のMODに対応していません。アクティブなプレイセットで CS2 Multiplayer Mod 以外のすべてのMODを無効にしてから、ゲームを再起動してください。
CS2MP.Error.Full = このマルチプレイセッションは満員です。
CS2MP.Error.Full.Help = ホストに「最大プレイヤー数」を増やしてもらうか、他のプレイヤーが退出するまで待ってください。
CS2MP.Error.Address = ホストのアドレスが見つかりませんでした。
CS2MP.Error.Address.Help = アドレスに入力ミスがないか確認してください。同じ家庭内ネットワークの場合は、ホストPCのローカルIPアドレスを使用します。
CS2MP.Error.Refused = ホストPCは応答しましたが、そのポートでマルチプレイセッションが待ち受けていません。
CS2MP.Error.Refused.Help = ホストが「セッションをホスト」をクリックしていること、双方のプレイヤーが同じポートを入力していることを確認してください。
CS2MP.Error.Timeout = ホストが時間内に応答しませんでした。
CS2MP.Error.Timeout.Help = ホストがまだオンラインか確認し、アドレスとポートを見直したうえで、ホストのファイアウォールでそのポートを許可してください。インターネット越しのプレイにはTCPポート転送も必要です。
CS2MP.Error.Network = このPCからホストのネットワークに到達できません。
CS2MP.Error.Network.Help = インターネットまたはローカルネットワークの接続を確認してから、もう一度お試しください。同じネットワーク上にいる場合は、ホストのローカルIPを使用してください。
CS2MP.Error.PortInUse = ホスト用のポートは、すでに別のプログラムが使用しています。
CS2MP.Error.PortInUse.Help = もう一方のホスト／ゲームのインスタンスを閉じるか、別のポートを選んで、そのポートを全プレイヤーに伝えてください。
CS2MP.Error.Removed = ホストによってこのマルチプレイセッションから退出させられました。
CS2MP.Error.Removed.Help = 再度参加を試みる前に、ホストに確認してください。
CS2MP.Error.Declined = ホストがセッションへの参加を許可しませんでした。
CS2MP.Error.Declined.Help = 参加にはホストの承認が必要です。参加を許可してもらってから、もう一度お試しください。
CS2MP.Error.Generic = マルチプレイの接続を完了できませんでした。
CS2MP.Error.Generic.Help = もう一度お試しください。繰り返す場合は、双方のゲームを再起動し、アドレスとポートを確認し、両方のPCでMODが更新されているか確認してください。


# CS2 Multiplayer Mod - Japanese locale (ja-JP)
#
# ============================ Options screen ============================
@settings = CS2 マルチプレイヤー Mod

@tab.General = 一般
@tab.Join = 参加
@tab.Host = ホスト

@group.General = 一般
@group.Status = ステータス
@group.Session = セッション操作
@group.JoinSetup = 接続先設定
@group.JoinAction = 参加
@group.HostSetup = ホスト設定
@group.HostAction = ホスト開始

# -- 一般タブ --
@label.EnableMod = Modを有効化
@desc.EnableMod = マルチプレイヤー機能を有効化または無効化します。

@label.PlayerName = プレイヤー名
@desc.PlayerName = 他のプレイヤーに表示されるあなたの名前です。

@label.VerboseLogging = 詳細ログ
@desc.VerboseLogging = トラブルシューティング用の詳細なログを出力します。

@label.StatusRole = ロール
@desc.StatusRole = オフライン、ホスト、またはクライアントの状態を表示します。

@label.StatusState = 接続状態
@desc.StatusState = 現在の接続ステータスまたは最後のエラー。

@label.StatusPlayers = プレイヤー
@desc.StatusPlayers = 現在接続中のプレイヤー一覧。

@label.StatusAccess = アクセス
@desc.StatusAccess = パスワード保護の有無。

@label.StatusExposure = ネットワーク
@desc.StatusExposure = LAN専用またはインターネット/LAN公開。

@label.StatusWorld = ワールド
@desc.StatusWorld = 都市の読み込みおよびホスト状態。

@label.DisconnectButton = 切断
@desc.DisconnectButton = セッションから切断し、すべての通信を終了します。

# -- 参加タブ --
@label.JoinConnection = 接続方式
@desc.JoinConnection = Steam Relay または ダイレクト接続を選択。

@label.JoinCodeInput = 参加コード
@desc.JoinCodeInput = ホストから共有された参加コード。

@label.ServerAddress = ホストアドレス
@desc.ServerAddress = サーバーのIPアドレスまたはホスト名。

@label.JoinPort = ポート
@desc.JoinPort = ホストのTCPポート（デフォルト: 25001）。

@label.JoinPassword = パスワード
@desc.JoinPassword = サーバーのパスワード（設定されている場合）。

@label.JoinStatus = ステータス
@desc.JoinStatus = 現在の接続状態。

@label.JoinButton = セッションに参加
@desc.JoinButton = ホストに接続し、都市データをダウンロードします。

@label.JoinDisconnectButton = 切断
@desc.JoinDisconnectButton = 現在のセッションから退出します。

# -- ホストタブ --
@label.HostConnection = 接続方式
@desc.HostConnection = ホスト用の接続タイプ。

@label.HostJoinCode = あなたの参加コード
@desc.HostJoinCode = Steam Relay 経由で参加するフレンドにこのコードを共有してください。

@label.HostPort = 開放ポート
@desc.HostPort = 待受TCPポート（1-65535、デフォルト: 25001）。

@label.HostPassword = サーバーパスワード
@desc.HostPassword = 参加に必要なパスワード。

@label.HostMaxPlayers = 最大プレイヤー数
@desc.HostMaxPlayers = 同時接続可能な最大プレイヤー数（2-16）。

@label.HostLanOnly = LAN（ローカルネットワーク）専用
@desc.HostLanOnly = ローカルネットワーク内のみに限定します。

@label.HostAutoSyncMinutes = 自動同期インターバル（分）
@desc.HostAutoSyncMinutes = 完全セーブ同期の間隔（0で無効）。

@label.HostStatus = ステータス
@desc.HostStatus = ホストの待受状態。

@label.HostButton = ホストを開始
@desc.HostButton = 現在の都市をマルチプレイヤーセッションとして公開します。

@label.HostStopButton = ホストを停止
@desc.HostStopButton = マルチプレイヤーセッションを終了します。

@label.HostSaveRecoveryButton = 共有都市を保存
@desc.HostSaveRecoveryButton = 現在の都市データを保存します。


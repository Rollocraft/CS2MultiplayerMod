CS2MP.UI.ModsBlockedRestart = マルチプレイは、プレイセット内で CS2 Multiplayer Mod が唯一のMODである場合にのみ動作します。他のMODはプレハブ、ツール、シミュレーションを変更するため、同期ずれやクラッシュを引き起こします。次のMODはまだ読み込まれているため、無効にしたあとゲームを再起動してください: {0}
CS2MP.UI.ModsIgnoredTitle = 互換性チェックを無視しました
CS2MP.UI.ModsIgnored = 他のMODが有効ですが、「MOD互換性チェックを無視」がオンになっています: {0}。マルチプレイは自己責任で続行されます。同期ずれ、都市の破損、クラッシュが起こる可能性があります。セーブデータのバックアップを取り、すべてのプレイヤーが同じリスクを承知のうえで受け入れていることを確認してください。


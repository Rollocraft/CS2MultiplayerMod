CS2MP.Host.LoadCityFirst = 「マルチプレイ > ゲームをホスト」を選んで都市を読み込むか作成するか、ホストする前に通常どおり都市を読み込んでください。
CS2MP.Host.Ready = 現在の都市をホストする準備ができています。
CS2MP.Host.SessionActive = マルチプレイセッションはすでに実行中です。


CS2MP.Connection.DirectHint = プレイヤーはあなたのアドレスとポートに接続します。ルーターでポート転送が必要です。
CS2MP.Connection.RelayUnavailableHint = 現在Steamが利用できないため、リレーによるホストを開始できません。直接接続を使用するか、Steam経由でゲームを起動してください。

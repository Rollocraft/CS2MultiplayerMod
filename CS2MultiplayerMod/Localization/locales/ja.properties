# -- General tab --
@label.ModVersion = バージョン
@desc.ModVersion = このゲームで動作しているMODのバージョンです。不具合報告では必ず記載してください。自分でビルドした場合は、ビルド時刻と使用しているネットワークプロトコルも表示されます。

@label.EnableMod = Modを有効化
@desc.EnableMod = マルチプレイMODのオン／オフを切り替えます。

@label.PlayerName = プレイヤー名
@desc.PlayerName = 他のプレイヤーに表示されるあなたの名前です。

@label.ShowPartnerMarkers = パートナーマーカーを表示
@desc.ShowPartnerMarkers = ?????????????????????????????????????????????????????????????????????????

@label.VerboseLogging = 詳細ログ
@desc.VerboseLogging = ログに各操作の詳細を追加します。接続・切断、都市の転送、すべての再同期とその原因、破棄された操作、MODのバージョン、他に有効なMOD、すべてのエラーは、この設定がオフでも記録されます。完全なログを求められたときにオンにしてください。ログは長くなりますが、動作が遅くなることはありません。

@label.ExportDiagnosticsButton = 診断情報を保存
@desc.ExportDiagnosticsButton = 現在のセッション状態とMODのCS2MP-flight.logをまとめた1つのファイルをゲームのLogsフォルダーに書き出します。不具合報告にそのまま添付できます。セッション中はマルチプレイチャットで /diag と入力しても同じです。

@label.DiagnosticsStatus = 診断ファイル
@desc.DiagnosticsStatus = 「診断情報を保存」で最後に書き出したファイルです（ゲームのLogsフォルダー内）。公開する前に内容を確認してください。

# -- セッション操作 (一般タブ) --
@label.DisconnectButton = 切断
@desc.DisconnectButton = セッションを離れます。ホストの場合はセッションを閉じ、すべての接続を切ります。

# -- Join tab --
@label.JoinConnection = 接続方法
@desc.JoinConnection = Steamリレーは、ホストから渡されたコードだけで接続します（アドレスもポートも不要）。直接接続は従来の方法で、ホストのアドレスとポートを入力します。ホストが選んだ方を使ってください。

@label.JoinCodeInput = 参加コード
@desc.JoinCodeInput = ホストが自分のホスト画面で確認するコードです。それ以外に合わせるものはありません。

@label.ServerAddress = ホストのアドレス
@desc.ServerAddress = ゲームをホストしているプレイヤーのIPアドレスまたはホスト名です（ホスト開始時にログに表示されます）。

@label.JoinPort = ポート
@desc.JoinPort = ホストのTCPポート（既定は25001）。ホストが開放したポートと完全に一致している必要があります。

@label.JoinPassword = パスワード
@desc.JoinPassword = ホストがサーバーパスワードを設定している場合に入力します。平文で送信されることはありません。

@label.JoinStatus = ステータス
@desc.JoinStatus = 現在の接続状態です。参加はメインメニューから行えます。都市はホストから転送されます。

@label.JoinButton = セッションに参加
@desc.JoinButton = 上記のホストに接続し、その都市をダウンロードします。メインメニューから利用でき、ローカルのセーブデータは不要です。メインメニューの「ゲームに参加」ダイアログと同じ動作です。

@label.JoinDisconnectButton = 切断
@desc.JoinDisconnectButton = 現在のセッションから退出し、すべての接続を閉じます。

# -- Host tab --
@label.HostConnection = 接続方法
@desc.HostConnection = Steamリレーなら、参加コードだけでフレンドが参加できます。ポート開放もルーター設定も不要です。直接接続は従来の方法で、ポート転送が必要ですがSteamがなくても動作します。

@label.HostJoinCode = あなたの参加コード
@desc.HostJoinCode = これをフレンドに渡してください。参加画面の「ホストのアドレス」に貼り付ければ、そのまま接続できます。

@label.HostPort = 開放するポート
@desc.HostPort = サーバーが待ち受けるTCPポート（1〜65535、既定は25001）。参加するプレイヤーはこのポートを正確に入力する必要があります。インターネット越しに遊ぶ場合は、ルーターでこのTCPポートをこのPCに転送し、Windowsファイアウォールで許可してください。

@label.HostPassword = サーバーパスワード
@desc.HostPassword = プレイヤーが参加するために入力するパスワードです（平文で送信されることはありません）。インターネット越しに直接接続でホストする場合は必須で、8文字以上が必要です。設定しないと、ポートを見つけた人は誰でも参加してあなたの都市をダウンロードできてしまいます。SteamリレーとLANのみでは不要です。

@label.LanOnly = LANのみ
@desc.LanOnly = ローカルネットワークのプレイヤーのみを受け付けます。フレンドがインターネット経由で参加できるよう既定ではオフです（ポート転送と8文字以上のサーバーパスワードが必要）。

@label.RequireJoinApproval = 参加プレイヤーを承認
@desc.RequireJoinApproval = オンにすると、参加しようとする各プレイヤーは、あなたに承認／拒否の確認が表示される間待機します。オフにすると、パスワードとバージョンのチェックを通過した人を自動的に受け入れます。

@label.AutoApproveSteamFriends = Steamフレンドを自動承認
@desc.AutoApproveSteamFriends = プレイヤー承認が有効な場合、認証済みのSteamフレンドはすぐに参加できます。それ以外のプレイヤーは引き続き承認を待ちます。Steam Relay専用です。

@label.ResyncPolicy = クライアントの再同期リクエスト
@desc.ResyncPolicy = クライアントのワールド同期をすぐに許可するか、開始前にホストへ確認するか、ホストからの同期のみに制限します。自動復旧リクエストにも同じルールが適用されます。

@label.MaxPlayers = 最大プレイヤー数
@desc.MaxPlayers = あなたを含む同時接続プレイヤーの最大数（2〜32）。


@label.HostStatus = ホストの状態
@desc.HostStatus = ホストには都市の読み込みが必要です。あなたの都市が全員のプレイするワールドになります。

@label.HostButton = セッションをホスト
@desc.HostButton = 現在の都市を上記のポートでサーバーとして公開します。他のプレイヤーが使用できる正確なアドレスはログに一覧表示されます。接続したプレイヤーには自動的にマップが送られます。

@label.SyncWorldButton = ワールドを同期
@desc.SyncWorldButton = 接続中のすべてのプレイヤーに今すぐ都市を再送信し、相手側のコピーを置き換えます。プレイヤー間のずれを解消したいときに使用します。ゲーム内のマルチプレイパネルにある「ワールドを同期」ボタンと同じ動作で、そのボタンが見当たらない場合の代替としてここに残しています。

# -- 詳細設定タブ --
@label.IgnoreModCompatibilityChecks = MOD互換性チェックを無視（自己責任）
@desc.IgnoreModCompatibilityChecks = 他のMODの併用を許可し、ホスト時には CS2 Multiplayer Mod のバージョン違いも許可します。同期ずれ、都市の破損、クラッシュの原因になることがあります。プロトコル・ゲームバージョン・DLCのチェックは引き続き適用されます。変更はオフラインのときだけにしてください。


CS2MP.Error.ModVersion.Help = 双方のプレイヤーがMODを同じバージョンに更新し、ゲームを再起動してからもう一度お試しください。
CS2MP.Error.GameVersion = Cities: Skylines II のバージョンが一致していません。
CS2MP.Error.GameVersion.Help = 双方のPCでゲームを更新し、同じSteamブランチを使用していることを確認してから再起動してください。

# ===================== Friendly connection errors =====================
CS2MP.Error.Password = パスワードが受け付けられませんでした。
CS2MP.Error.Password.Help = ホストにパスワードを確認し、入力し直してからもう一度お試しください。パスワードは大文字と小文字を区別します。

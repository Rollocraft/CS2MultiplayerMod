# ===================== Friendly connection errors =====================
CS2MP.Error.Password = Hasło nie zostało zaakceptowane.
CS2MP.Error.Password.Help = Sprawdź hasło u hosta, wpisz je ponownie i spróbuj jeszcze raz. W hasłach rozróżniana jest wielkość liter.
CS2MP.Error.ModVersion = Wasze wersje moda do gry wieloosobowej nie są zgodne.
CS2MP.Error.ModVersion.Help = Obaj gracze powinni zaktualizować moda do tej samej wersji, uruchomić grę ponownie i spróbować jeszcze raz.
CS2MP.Error.GameVersion = Wasze wersje Cities: Skylines II nie są zgodne.
CS2MP.Error.GameVersion.Help = Zaktualizujcie grę na obu komputerach i upewnijcie się, że obaj gracze korzystają z tej samej gałęzi Steam, a następnie uruchomcie grę ponownie.
CS2MP.Error.Dlc = Włączone dodatki DLC hosta i tego gracza nie są zgodne.
CS2MP.Error.Dlc.Help = Włączcie te same dodatki DLC na obu komputerach, uruchomcie grę ponownie i spróbujcie jeszcze raz.
CS2MP.Error.Mods = Włączone są inne mody.
CS2MP.Error.Mods.Help = Tryb wieloosobowy nie obsługuje innych modów. Wyłącz w aktywnym playsecie wszystkie mody oprócz CS2 Multiplayer Mod, a potem uruchom grę ponownie.
CS2MP.Error.Full = Ta sesja wieloosobowa jest pełna.
CS2MP.Error.Full.Help = Poproś hosta o zwiększenie wartości Maks. graczy albo poczekaj, aż ktoś opuści sesję.
CS2MP.Error.Address = Nie znaleziono adresu hosta.
CS2MP.Error.Address.Help = Sprawdź, czy w adresie nie ma literówek. W tej samej sieci domowej użyj lokalnego adresu IP komputera hosta.
CS2MP.Error.Refused = Komputer hosta odpowiedział, ale na tym porcie nie nasłuchuje żadna sesja wieloosobowa.
CS2MP.Error.Refused.Help = Upewnij się, że host kliknął Hostuj sesję i że obaj gracze wpisali ten sam port.
CS2MP.Error.Timeout = Host nie odpowiedział na czas.
CS2MP.Error.Timeout.Help = Sprawdź, czy host jest nadal online, zweryfikuj adres i port oraz zezwól na ten port w zaporze hosta. Gra przez Internet wymaga dodatkowo przekierowania portu TCP.
CS2MP.Error.Network = Ten komputer nie może połączyć się z siecią hosta.
CS2MP.Error.Network.Help = Sprawdź połączenie internetowe lub lokalne i spróbuj ponownie. Jeśli jesteście w tej samej sieci, użyj lokalnego adresu IP hosta.
CS2MP.Error.PortInUse = Port hostowania jest już używany przez inny program.
CS2MP.Error.PortInUse.Help = Zamknij drugą instancję serwera lub gry albo wybierz inny port i podaj dokładnie ten port wszystkim graczom.
CS2MP.Error.Removed = Host usunął cię z tej sesji wieloosobowej.
CS2MP.Error.Removed.Help = Zapytaj hosta, zanim spróbujesz dołączyć ponownie.
CS2MP.Error.Declined = Host nie wpuścił cię do sesji.
CS2MP.Error.Declined.Help = Host musi zatwierdzić twoje dołączenie. Poproś go, aby cię wpuścił, i spróbuj ponownie.
CS2MP.Error.Generic = Tryb wieloosobowy nie zdołał nawiązać połączenia.
CS2MP.Error.Generic.Help = Spróbuj jeszcze raz. Jeśli to się powtarza, uruchomcie obie gry ponownie, sprawdźcie adres i port oraz upewnijcie się, że mod jest zaktualizowany na obu komputerach.


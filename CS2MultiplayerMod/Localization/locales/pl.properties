# ===================== One-time disclaimer gate =====================
CS2MP.UI.DisclaimerTitle = Zanim przejdziesz dalej
CS2MP.UI.DisclaimerBody = Tryb wieloosobowy to eksperymentalne oprogramowanie w wersji beta, udostępniane bezpłatnie „tak jak jest”. Hostuj sesje i dołączaj do nich tylko z osobami, którym ufasz. Kontynuując, akceptujesz, że korzystasz z tego moda na własne ryzyko i że autor nie ponosi odpowiedzialności za szkody, utratę danych ani inne problemy wynikające z jego użycia.

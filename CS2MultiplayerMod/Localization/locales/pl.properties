# ===================== Other-mods block =====================
CS2MP.UI.ModsBlockedTitle = Włączone inne mody
CS2MP.UI.ModsBlocked = Tryb wieloosobowy działa tylko wtedy, gdy CS2 Multiplayer Mod jest jedynym modem w twoim playsecie. Inne mody zmieniają prefaby, narzędzia lub symulację i doprowadzą do desynchronizacji albo awarii sesji. Wyłącz te w aktywnym playsecie: {0}
CS2MP.UI.ModsBlockedRestart = Tryb wieloosobowy działa tylko wtedy, gdy CS2 Multiplayer Mod jest jedynym modem w twoim playsecie. Inne mody zmieniają prefaby, narzędzia lub symulację i doprowadzą do desynchronizacji albo awarii sesji. Te są nadal wczytane, więc po ich wyłączeniu uruchom grę ponownie: {0}
CS2MP.UI.ModsIgnoredTitle = Zignorowano sprawdzanie zgodności
CS2MP.UI.ModsIgnored = Aktywne są inne mody, ale opcja Ignoruj sprawdzanie zgodności modów jest włączona: {0}. Tryb wieloosobowy będzie kontynuowany na twoje ryzyko; możliwe są desynchronizacje, uszkodzone miasta i awarie gry. Rób kopie zapasowe zapisów i upewnij się, że każdy gracz świadomie akceptuje to samo ryzyko.


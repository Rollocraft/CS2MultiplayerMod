# -- General tab --
@label.EnableMod = Włącz moda
@desc.EnableMod = Włącza lub wyłącza moda do gry wieloosobowej.

@label.PlayerName = Nazwa gracza
@desc.PlayerName = Nazwa, którą widzą inni gracze.

@label.ShowPartnerMarkers = Pokaż znaczniki partnerów
@desc.ShowPartnerMarkers = Rysuje kolorowy pierścień w miejscu, w które patrzy każdy z pozostałych graczy, wraz z linią prowadzącą do jego kamery. Wyłącz to, jeśli wolisz zyskać klatki: to jedyna część moda rysująca w każdej klatce.

@label.IgnoreModCompatibilityChecks = Ignoruj sprawdzanie zgodności modów (na własne ryzyko)
@desc.IgnoreModCompatibilityChecks = Zezwala na inne aktywne mody, a podczas hostowania także na inne wersje CS2 Multiplayer Mod. Może to powodować desynchronizacje, uszkodzone miasta lub awarie gry. Kontrole protokołu, wersji gry i DLC nadal obowiązują. Zmieniaj tylko poza sesją.

@label.VerboseLogging = Szczegółowe logowanie
@desc.VerboseLogging = Zapisuje więcej szczegółów na potrzeby diagnostyki (każdą akcję synchronizacji i okresową diagnostykę). Zostaw wyłączone dla czytelniejszych logów; włącz, gdy chcesz udostępnić szczegółowy log przy proszeniu o pomoc.

@label.StatusRole = Rola
@desc.StatusRole = Czy ta instancja jest offline, hostuje, czy dołączyła jako klient.

@label.StatusState = Połączenie
@desc.StatusState = Bieżący stan połączenia lub ostatni błąd w trybie offline.

@label.StatusPlayers = Gracze
@desc.StatusPlayers = Połączeni gracze widoczni dla tej sesji.

@label.StatusAccess = Dostęp
@desc.StatusAccess = Czy dołączenie wymaga hasła serwera.

@label.StatusExposure = Sieć
@desc.StatusExposure = Czy host jest ograniczony do sieci lokalnej, czy przyjmuje połączenia z Internetu/LAN.

@label.StatusWorld = Świat
@desc.StatusWorld = Bieżący stan wczytywania lub hostowania świata hosta.

@label.DisconnectButton = Rozłącz
@desc.DisconnectButton = Opuszcza bieżącą sesję i zamyka wszystkie połączenia.

# -- Join tab --
@label.JoinConnection = Połączenie
@desc.JoinConnection = Przekaźnik Steam łączy cię z hostem za pomocą kodu, który ci podał - bez adresu i bez portu. Połączenie bezpośrednie to pierwotny sposób: wpisz adres i port hosta. Użyj tego, co wybrał host.

@label.JoinCodeInput = Kod dołączenia
@desc.JoinCodeInput = Kod, który host odczytuje na swoim ekranie hostowania. Nic więcej nie musi się zgadzać.

@label.ServerAddress = Adres hosta
@desc.ServerAddress = Adres IP lub nazwa hosta gracza, który hostuje grę (widzi go w swoim logu po rozpoczęciu hostowania).

@label.JoinPort = Port
@desc.JoinPort = Port TCP hosta (domyślnie 25001). Musi dokładnie odpowiadać portowi otwartemu przez hosta.

@label.JoinPassword = Hasło
@desc.JoinPassword = Hasło serwera hosta, jeśli zostało ustawione. Nigdy nie jest wysyłane otwartym tekstem.

@label.JoinStatus = Stan
@desc.JoinStatus = Bieżący stan połączenia. Dołączanie działa z menu głównego - miasto jest przesyłane od hosta.

@label.JoinButton = Dołącz do sesji
@desc.JoinButton = Łączy się z powyższym hostem i pobiera jego miasto. Działa z menu głównego; lokalny zapis nie jest potrzebny. To ta sama akcja co okno Dołącz do gry w menu głównym.

@label.JoinDisconnectButton = Rozłącz
@desc.JoinDisconnectButton = Opuszcza bieżącą sesję i zamyka wszystkie połączenia.

# -- Host tab --
@label.HostConnection = Połączenie
@desc.HostConnection = Dzięki przekaźnikowi Steam znajomi dołączają, mając tylko twój kod - żadnego portu do otwarcia i żadnej konfiguracji routera. Połączenie bezpośrednie to pierwotny sposób: wymaga przekierowanego portu, ale działa bez Steama.

@label.HostJoinCode = Twój kod dołączenia
@desc.HostJoinCode = Przekaż go znajomym. Wklejają go w pole Adres hosta na swoim ekranie dołączania i od razu się łączą.

@label.HostPort = Port do otwarcia
@desc.HostPort = Port TCP, na którym nasłuchuje twój serwer (1-65535, domyślnie 25001). Dołączający gracze muszą wpisać dokładnie ten port. Do gry przez Internet przekieruj ten port TCP na routerze do tego komputera i zezwól na niego w Zaporze Windows.

@label.HostPassword = Hasło serwera
@desc.HostPassword = Gracze muszą je podać, aby dołączyć (nigdy nie jest wysyłane otwartym tekstem). Zdecydowanie zalecane przy grze przez Internet - bez hasła każdy, kto znajdzie port, może dołączyć i pobrać twoje miasto.

@label.LanOnly = Tylko sieć lokalna
@desc.LanOnly = Przyjmuje wyłącznie graczy z twojej sieci lokalnej. Domyślnie wyłączone, aby znajomi mogli dołączać przez Internet (wymaga przekierowania portu). Do gry przez Internet zdecydowanie zalecane jest silne hasło.

@label.RequireJoinApproval = Zatwierdzaj dołączających graczy
@desc.RequireJoinApproval = Gdy opcja jest włączona, każdy gracz próbujący dołączyć czeka, aż zobaczysz pytanie o akceptację lub odrzucenie. Wyłącz ją, aby automatycznie wpuszczać każdego, kto przejdzie kontrolę hasła i wersji.

@label.MaxPlayers = Maks. graczy
@desc.MaxPlayers = Maksymalna liczba graczy jednocześnie, wliczając ciebie (2-32).

@label.ResyncMinutes = Ponowna synchronizacja świata (minuty)
@desc.ResyncMinutes = Jak często cały świat jest ponownie zapisywany i przesyłany do klientów, aby skorygować rozbieżności. Mniej = większa spójność, ale więcej przerw na wczytywanie.

@label.HostStatus = Stan hostowania
@desc.HostStatus = Hostowanie wymaga wczytanego miasta: twoje miasto jest światem, w którym grają wszyscy.

@label.HostButton = Hostuj sesję
@desc.HostButton = Udostępnia twoje bieżące miasto jako serwer na powyższym porcie. Log wypisuje dokładne adresy, których mogą użyć inni gracze. Łączący się gracze otrzymują mapę automatycznie.

@label.SyncWorldButton = Synchronizuj świat
@desc.SyncWorldButton = Natychmiast wysyła twoje miasto ponownie do wszystkich połączonych graczy, zastępując ich kopię. Użyj tego, aby usunąć rozbieżności między graczami. To samo co przycisk Synchronizuj świat w panelu wieloosobowym w grze - tutaj jako rozwiązanie zapasowe, gdyby tamtego przycisku brakowało.


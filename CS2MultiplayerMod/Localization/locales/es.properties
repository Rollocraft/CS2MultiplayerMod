# ===================== Friendly connection errors =====================
CS2MP.Error.Password = No se aceptó la contraseña.
CS2MP.Error.Password.Help = Confirma la contraseña con el anfitrión, vuelve a introducirla e inténtalo de nuevo. Las contraseñas distinguen mayúsculas y minúsculas.
CS2MP.Error.ModVersion = Vuestras versiones del mod multijugador no coinciden.
CS2MP.Error.ModVersion.Help = Ambos jugadores deben actualizar el mod a la misma versión, reiniciar el juego y volver a intentarlo.
CS2MP.Error.GameVersion = Vuestras versiones de Cities: Skylines II no coinciden.
CS2MP.Error.GameVersion.Help = Actualizad el juego en ambos PC y aseguraos de que los dos jugadores usan la misma rama de Steam; después reiniciad.
CS2MP.Error.Dlc = Los DLC activados no coinciden entre el anfitrión y este jugador.
CS2MP.Error.Dlc.Help = Activad los mismos DLC en ambos PC, reiniciad el juego e intentadlo de nuevo.
CS2MP.Error.Mods = Hay otros mods activados.
CS2MP.Error.Mods.Help = El multijugador no admite otros mods. Desactiva todos los mods excepto CS2 Multiplayer Mod en tu playset activo y reinicia el juego.
CS2MP.Error.Full = Esta sesión multijugador está llena.
CS2MP.Error.Full.Help = Pide al anfitrión que aumente Jugadores máx. o espera a que salga otro jugador.
CS2MP.Error.Address = No se encontró la dirección del anfitrión.
CS2MP.Error.Address.Help = Comprueba que la dirección no tenga erratas. En la misma red doméstica, usa la IP local del PC del anfitrión.
CS2MP.Error.Refused = El PC del anfitrión respondió, pero no hay ninguna sesión multijugador escuchando en ese puerto.
CS2MP.Error.Refused.Help = Asegúrate de que el anfitrión ha pulsado Alojar sesión y de que ambos jugadores han introducido el mismo puerto.
CS2MP.Error.Timeout = El anfitrión no respondió a tiempo.
CS2MP.Error.Timeout.Help = Comprueba que el anfitrión sigue en línea, verifica la dirección y el puerto, y permite el puerto en el firewall del anfitrión. Las partidas por Internet también necesitan la redirección del puerto TCP.
CS2MP.Error.Network = Este PC no puede alcanzar la red del anfitrión.
CS2MP.Error.Network.Help = Comprueba tu conexión a Internet o a la red local y vuelve a intentarlo. Si estáis en la misma red, usa la IP local del anfitrión.
CS2MP.Error.PortInUse = Otro programa ya está usando el puerto de alojamiento.
CS2MP.Error.PortInUse.Help = Cierra la otra instancia del servidor o del juego, o elige otro puerto y comunica ese mismo puerto a todos los jugadores.
CS2MP.Error.Removed = El anfitrión te ha expulsado de esta sesión multijugador.
CS2MP.Error.Removed.Help = Habla con el anfitrión antes de volver a intentar unirte.
CS2MP.Error.Declined = El anfitrión no te ha dejado entrar en la sesión.
CS2MP.Error.Declined.Help = El anfitrión debe aprobar tu entrada. Pídele que te deje entrar y vuelve a intentarlo.
CS2MP.Error.Generic = El multijugador no pudo completar la conexión.
CS2MP.Error.Generic.Help = Inténtalo otra vez. Si se repite, reiniciad ambos juegos, verificad la dirección y el puerto, y comprobad que el mod está actualizado en los dos PC.


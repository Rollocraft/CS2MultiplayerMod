# CS2 Multiplayer Mod - Spanish locale (es-ES)
#
# ============================ Options screen ============================
@settings = Mod Multijugador CS2

@tab.General = General
@tab.Join = Unirse
@tab.Host = Servidor

@group.General = General
@group.Status = Estado
@group.Session = Acciones de sesión
@group.JoinSetup = Servidor al que unirse
@group.JoinAction = Unirse
@group.HostSetup = Configuración del servidor

# -- Pestaña General --
@label.EnableMod = Activar mod
@desc.EnableMod = Activa o desactiva el mod multijugador.

@label.PlayerName = Nombre de jugador
@desc.PlayerName = El nombre que otros jugadores verán de ti.

@label.VerboseLogging = Registro detallado
@desc.VerboseLogging = Guarda detalles adicionales para resolución de problemas.

@label.StatusRole = Rol
@desc.StatusRole = Indica si estás sin conexión, como anfitrión o cliente.

@label.StatusState = Conexión
@desc.StatusState = Estado actual de la conexión o último error.

@label.StatusPlayers = Jugadores
@desc.StatusPlayers = Jugadores conectados a esta sesión.

@label.StatusAccess = Acceso
@desc.StatusAccess = Indica si se requiere contraseña.

@label.StatusExposure = Red
@desc.StatusExposure = Indica si el servidor es solo LAN o Internet/LAN.

@label.StatusWorld = Mundo
@desc.StatusWorld = Estado de carga o alojamiento de la ciudad.

@label.DisconnectButton = Desconectar
@desc.DisconnectButton = Sale de la sesión y cierra todas las conexiones.

# -- Pestaña Unirse --
@label.JoinConnection = Conexión
@desc.JoinConnection = Elige Steam Relay o Conexión Directa.

@label.JoinCodeInput = Código de unión
@desc.JoinCodeInput = El código que te dio el anfitrión.

@label.ServerAddress = Dirección del servidor
@desc.ServerAddress = Dirección IP o nombre de host del servidor.

@label.JoinPort = Puerto
@desc.JoinPort = Puerto TCP del anfitrión (por defecto 25001).

@label.JoinPassword = Contraseña
@desc.JoinPassword = Contraseña del servidor si está establecida.

@label.JoinStatus = Estado
@desc.JoinStatus = Estado de conexión actual.

@label.JoinButton = Unirse a la sesión
@desc.JoinButton = Conectarse al anfitrión y descargar su ciudad.

@label.JoinDisconnectButton = Desconectar
@desc.JoinDisconnectButton = Salir de la sesión actual.

# -- Pestaña Servidor --
@label.HostConnection = Conexión
@desc.HostConnection = Tipo de conexión para alojar la partida.

@label.HostJoinCode = Tu código de unión
@desc.HostJoinCode = Comparte este código con tus amigos para unirse vía Steam Relay.

@label.HostPort = Puerto a abrir
@desc.HostPort = Puerto TCP donde escucha el servidor (1-65535, por defecto 25001).

@label.HostPassword = Contraseña del servidor
@desc.HostPassword = Contraseña requerida para unirse.

@label.HostMaxPlayers = Máx. jugadores
@desc.HostMaxPlayers = Número máximo de jugadores permitidos (2-16).

@label.HostLanOnly = Solo red local (LAN)
@desc.HostLanOnly = Limita la partida a la red local.

@label.HostAutoSyncMinutes = Intervalo de sincronización (min)
@desc.HostAutoSyncMinutes = Tiempo entre sincronizaciones completas (0 para desactivar).

@label.HostStatus = Estado
@desc.HostStatus = Estado de alojamiento del servidor.

@label.HostButton = Iniciar servidor
@desc.HostButton = Abrir la ciudad actual para multijugador.

@label.HostStopButton = Detener servidor
@desc.HostStopButton = Cerrar la sesión multijugador.

@label.HostSaveRecoveryButton = Guardar ciudad compartida
@desc.HostSaveRecoveryButton = Guardar una copia de la ciudad actual.


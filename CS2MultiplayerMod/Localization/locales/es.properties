# ===================== Other-mods block =====================
CS2MP.UI.ModsBlockedTitle = Hay otros mods activados
CS2MP.UI.ModsBlocked = El multijugador solo funciona si CS2 Multiplayer Mod es el único mod de tu playset. Los demás mods cambian prefabs, herramientas o la simulación y provocarán desincronizaciones o cierres inesperados. Desactiva estos en tu playset activo: {0}
CS2MP.UI.ModsBlockedRestart = El multijugador solo funciona si CS2 Multiplayer Mod es el único mod de tu playset. Los demás mods cambian prefabs, herramientas o la simulación y provocarán desincronizaciones o cierres inesperados. Estos siguen cargados, así que reinicia el juego después de desactivarlos: {0}
CS2MP.UI.ModsIgnoredTitle = Comprobación de compatibilidad ignorada
CS2MP.UI.ModsIgnored = Hay otros mods activos, pero la opción Ignorar comprobaciones de compatibilidad de mods está activada: {0}. El multijugador continuará bajo tu responsabilidad; son posibles desincronizaciones, ciudades dañadas y cierres inesperados. Guarda copias de seguridad y asegúrate de que todos los jugadores aceptan conscientemente el mismo riesgo.


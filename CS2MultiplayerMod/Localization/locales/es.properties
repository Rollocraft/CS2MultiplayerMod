# -- General tab --
@label.EnableMod = Activar el mod
@desc.EnableMod = Activa o desactiva el mod multijugador.

@label.PlayerName = Nombre de jugador
@desc.PlayerName = El nombre con el que te ven los demás jugadores.

@label.ShowPartnerMarkers = Mostrar marcadores de los compañeros
@desc.ShowPartnerMarkers = Dibuja un anillo de color donde está mirando cada uno de los demás jugadores, con una línea hasta su cámara. Desactívalo si prefieres ganar fotogramas: esta es la única parte del mod que dibuja en cada fotograma.

@label.IgnoreModCompatibilityChecks = Ignorar comprobaciones de compatibilidad de mods (bajo tu responsabilidad)
@desc.IgnoreModCompatibilityChecks = Permite otros mods activos y, cuando alojas, versiones distintas de CS2 Multiplayer Mod. Esto puede provocar desincronizaciones, ciudades dañadas o cierres inesperados. Las comprobaciones de protocolo, versión del juego y DLC se siguen aplicando. Cámbialo solo estando sin conexión.

@label.VerboseLogging = Registro detallado
@desc.VerboseLogging = Registra más detalles para solucionar problemas (cada acción de sincronización y los diagnósticos periódicos). Déjalo desactivado para registros más limpios; actívalo cuando quieras compartir un registro detallado al pedir ayuda.

# Diagnostic logging: each topic is a separate switch so a log stays readable.
@group.Diagnostics = Registro de diagnóstico
@label.LogPerformance = Registrar rendimiento
@desc.LogPerformance = Cada 30 segundos registra los tiempos de fotograma y cuánto tiempo del hilo principal ha usado el propio mod, desglosado en residencial, comercial, industrial y oficinas. Es lo que permite distinguir el coste del mod del de la ciudad.
@label.LogResidential = Registrar sincronización residencial
@desc.LogResidential = Registra detalles sobre hogares, residentes y dónde vive cada uno.
@label.LogCommercial = Registrar sincronización comercial
@desc.LogCommercial = Registra detalles sobre las tiendas: qué empresa alquila cada edificio, sus cifras y sus existencias.
@label.LogIndustrial = Registrar sincronización industrial
@desc.LogIndustrial = Registra detalles sobre fábricas y extractoras: qué empresa alquila cada edificio, sus cifras y sus existencias.
@label.LogOffice = Registrar sincronización de oficinas
@desc.LogOffice = Registra detalles sobre las oficinas: qué empresa alquila cada edificio, sus cifras y sus existencias.

@label.StatusRole = Rol
@desc.StatusRole = Si esta instancia está sin conexión, alojando o unida como cliente.

@label.StatusState = Conexión
@desc.StatusState = Estado actual de la conexión o el último fallo sin conexión.

@label.StatusPlayers = Jugadores
@desc.StatusPlayers = Jugadores conectados visibles para esta sesión.

@label.StatusAccess = Acceso
@desc.StatusAccess = Si unirse requiere la contraseña del servidor.

@label.StatusExposure = Red
@desc.StatusExposure = Si el anfitrión está limitado a la red local o acepta conexiones de Internet/LAN.

@label.StatusWorld = Mundo
@desc.StatusWorld = Estado actual de carga o alojamiento del mundo del anfitrión.

@label.DisconnectButton = Desconectar
@desc.DisconnectButton = Abandona la sesión actual y cierra todas las conexiones.

# -- Join tab --
@label.JoinConnection = Conexión
@desc.JoinConnection = El retransmisor de Steam te conecta al anfitrión con el código que te haya dado, sin dirección ni puerto. La conexión directa es el método original: introduce la dirección y el puerto del anfitrión. Usa el que haya elegido el anfitrión.

@label.JoinCodeInput = Código de acceso
@desc.JoinCodeInput = El código que el anfitrión lee en su pantalla de alojamiento. No hace falta que coincida nada más.

@label.ServerAddress = Dirección del anfitrión
@desc.ServerAddress = Dirección IP o nombre de host del jugador que aloja la partida (la ve en su registro al empezar a alojar).

@label.JoinPort = Puerto
@desc.JoinPort = Puerto TCP del anfitrión (25001 por defecto). Debe coincidir con el puerto que el anfitrión ha abierto.

@label.JoinPassword = Contraseña
@desc.JoinPassword = La contraseña del servidor del anfitrión, si tiene una. Nunca se envía en texto plano.

@label.JoinStatus = Estado
@desc.JoinStatus = Estado actual de la conexión. Unirse funciona desde el menú principal: la ciudad se transfiere desde el anfitrión.

@label.JoinButton = Unirse a la sesión
@desc.JoinButton = Conecta con el anfitrión de arriba y descarga su ciudad. Funciona desde el menú principal; no hace falta una partida guardada local. Es la misma acción que el diálogo Unirse a partida del menú principal.

@label.JoinDisconnectButton = Desconectar
@desc.JoinDisconnectButton = Abandona la sesión actual y cierra todas las conexiones.

# -- Host tab --
@label.HostConnection = Conexión
@desc.HostConnection = Con el retransmisor de Steam tus amigos se unen solo con tu código de acceso: sin abrir puertos ni configurar el router. La conexión directa es el método original: necesita un puerto redirigido, pero funciona sin Steam.

@label.HostJoinCode = Tu código de acceso
@desc.HostJoinCode = Dáselo a tus amigos. Lo pegan en Dirección del anfitrión en su pantalla de unirse y conectan directamente.

@label.HostPort = Puerto que abrir
@desc.HostPort = Puerto TCP en el que escucha tu servidor (1-65535, 25001 por defecto). Los jugadores que se unan deben introducir exactamente este puerto. Para jugar por Internet, redirige este puerto TCP en tu router hacia este PC y permítelo en el Firewall de Windows.

@label.HostPassword = Contraseña del servidor
@desc.HostPassword = Los jugadores deben introducirla para unirse (nunca se envía en texto plano). Muy recomendable para jugar por Internet: sin ella, cualquiera que encuentre el puerto puede unirse y descargar tu ciudad.

@label.LanOnly = Solo red local
@desc.LanOnly = Acepta solo jugadores de tu red local. Desactivado por defecto para que tus amigos puedan unirse por Internet (requiere la redirección de puerto). Para jugar por Internet se recomienda encarecidamente una contraseña segura.

@label.RequireJoinApproval = Aprobar a los jugadores que se unen
@desc.RequireJoinApproval = Si está activado, cada jugador que intente unirse espera mientras tú recibes un aviso para aceptar o rechazar. Desactívalo para admitir automáticamente a quien supere las comprobaciones de contraseña y versión.

@label.MaxPlayers = Jugadores máx.
@desc.MaxPlayers = Número máximo de jugadores simultáneos, incluido tú (2-32).

@label.ResyncMinutes = Resincronización del mundo (minutos)
@desc.ResyncMinutes = Con qué frecuencia se vuelve a guardar el mundo completo y se envía a los clientes para corregir desviaciones. Menos = más consistente, pero más pausas de carga.

@label.HostStatus = Estado del alojamiento
@desc.HostStatus = Para alojar hace falta una ciudad cargada: tu ciudad es el mundo en el que juegan todos.

@label.HostButton = Alojar sesión
@desc.HostButton = Abre tu ciudad actual como servidor en el puerto de arriba. El registro muestra las direcciones exactas que pueden usar los demás jugadores. Los jugadores que conectan reciben el mapa automáticamente.

@label.SyncWorldButton = Sincronizar mundo
@desc.SyncWorldButton = Reenvía ahora tu ciudad a todos los jugadores conectados, sustituyendo su copia. Úsalo para eliminar cualquier desviación entre jugadores. Igual que el botón Sincronizar mundo del panel multijugador dentro de la partida: se mantiene aquí como alternativa por si ese botón falta.


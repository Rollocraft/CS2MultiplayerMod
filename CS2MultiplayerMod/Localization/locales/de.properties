# ===================== Verständliche Verbindungsfehler =====================
CS2MP.Error.Password = Das Passwort wurde nicht akzeptiert.
CS2MP.Error.Password.Help = Prüfe das Passwort mit dem Host, gib es erneut ein und versuche es noch einmal. Groß- und Kleinschreibung wird beachtet.
CS2MP.Error.ModVersion = Eure Versionen der Multiplayer-Mod stimmen nicht überein.
CS2MP.Error.ModVersion.Help = Aktualisiert die Mod auf beiden PCs auf dieselbe Version, startet das Spiel neu und versucht es erneut.
CS2MP.Error.GameVersion = Eure Versionen von Cities: Skylines II stimmen nicht überein.
CS2MP.Error.GameVersion.Help = Aktualisiert das Spiel auf beiden PCs und verwendet denselben Steam-Zweig. Startet danach beide Spiele neu.
CS2MP.Error.Dlc = Die aktivierten DLCs stimmen zwischen Host und Spieler nicht überein.
CS2MP.Error.Dlc.Help = Aktiviert auf beiden PCs dieselben DLCs, startet das Spiel neu und versucht es erneut.
CS2MP.Error.Mods = Es sind andere Mods aktiv.
CS2MP.Error.Mods.Help = Der Multiplayer unterstützt keine anderen Mods. Deaktiviere in deinem aktiven Playset alle Mods außer CS2 Multiplayer Mod und starte das Spiel neu.
CS2MP.Error.Full = Diese Multiplayer-Sitzung ist voll.
CS2MP.Error.Full.Help = Bitte den Host, „Max. Spieler“ zu erhöhen, oder warte, bis ein anderer Spieler die Sitzung verlässt.
CS2MP.Error.Address = Die Host-Adresse wurde nicht gefunden.
CS2MP.Error.Address.Help = Prüfe die Adresse auf Tippfehler. Im selben Heimnetzwerk verwendest du die lokale IP-Adresse des Host-PCs.
CS2MP.Error.Refused = Der Host-PC antwortet, aber auf diesem Port läuft keine Multiplayer-Sitzung.
CS2MP.Error.Refused.Help = Stelle sicher, dass der Host „Sitzung hosten“ angeklickt hat und beide Spieler denselben Port eingetragen haben.
CS2MP.Error.Timeout = Der Host hat nicht rechtzeitig geantwortet.
CS2MP.Error.Timeout.Help = Prüfe, ob der Host noch online ist, und kontrolliere Adresse und Port. Erlaube den Port in der Firewall des Hosts. Internet-Spiele benötigen außerdem eine TCP-Portweiterleitung.
CS2MP.Error.Network = Dieser PC kann das Netzwerk des Hosts nicht erreichen.
CS2MP.Error.Network.Help = Prüfe deine Internet- oder Netzwerkverbindung und versuche es erneut. Im selben Netzwerk verwendest du die lokale IP des Hosts.
CS2MP.Error.PortInUse = Der Hosting-Port wird bereits von einem anderen Programm verwendet.
CS2MP.Error.PortInUse.Help = Schließe die andere Host-/Spielinstanz oder wähle einen anderen Port und teile allen Spielern genau diesen Port mit.
CS2MP.Error.Removed = Der Host hat dich aus dieser Multiplayer-Sitzung entfernt.
CS2MP.Error.Removed.Help = Frage den Host, bevor du erneut beitrittst.
CS2MP.Error.Declined = Der Host hat dich nicht in die Sitzung gelassen.
CS2MP.Error.Declined.Help = Der Host muss deinen Beitritt bestätigen. Bitte ihn, dich hereinzulassen, und versuche es dann erneut.
CS2MP.Error.Generic = Die Multiplayer-Verbindung konnte nicht hergestellt werden.
CS2MP.Error.Generic.Help = Versuche es erneut. Falls es wieder passiert, startet beide Spiele neu, prüft Adresse und Port und aktualisiert die Mod auf beiden PCs.


# ===================== Other-mods block =====================
CS2MP.UI.ModsBlockedTitle = Andere Mods aktiv
CS2MP.UI.ModsBlocked = Der Multiplayer läuft nur, wenn CS2 Multiplayer Mod die einzige Mod in deinem Playset ist. Andere Mods verändern Prefabs, Werkzeuge oder die Simulation und führen zu Desyncs oder Abstürzen. Deaktiviere diese in deinem aktiven Playset: {0}
CS2MP.UI.ModsBlockedRestart = Der Multiplayer läuft nur, wenn CS2 Multiplayer Mod die einzige Mod in deinem Playset ist. Andere Mods verändern Prefabs, Werkzeuge oder die Simulation und führen zu Desyncs oder Abstürzen. Diese sind noch geladen - starte das Spiel neu, nachdem du sie deaktiviert hast: {0}
CS2MP.UI.ModsIgnoredTitle = Kompatibilitätsprüfung ignoriert
CS2MP.UI.ModsIgnored = Andere Mods sind aktiv, aber „Mod-Kompatibilitätsprüfungen ignorieren“ ist eingeschaltet: {0}. Der Multiplayer wird auf eigenes Risiko fortgesetzt; Desyncs, beschädigte Städte und Abstürze sind möglich. Stelle sicher, dass alle Spieler dieses Risiko bewusst akzeptieren.


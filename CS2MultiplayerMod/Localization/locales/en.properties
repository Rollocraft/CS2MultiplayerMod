# ===================== Friendly connection errors =====================
CS2MP.Error.Password = The password was not accepted.
CS2MP.Error.Password.Help = Check the password with the host, enter it again, and retry. Passwords are case-sensitive.
CS2MP.Error.ModVersion = Your multiplayer mod versions do not match.
CS2MP.Error.ModVersion.Help = Both players should update the mod to the same version, restart the game, and try again.
CS2MP.Error.GameVersion = Your Cities: Skylines II versions do not match.
CS2MP.Error.GameVersion.Help = Update the game on both PCs and make sure both players use the same Steam branch, then restart.
CS2MP.Error.Dlc = The enabled DLCs do not match between the host and this player.
CS2MP.Error.Dlc.Help = Enable the same DLCs on both PCs, restart the game, and try again.
CS2MP.Error.Mods = Other mods are enabled.
CS2MP.Error.Mods.Help = Multiplayer does not support other mods. Disable every mod except CS2 Multiplayer Mod in your active playset, then restart the game.
CS2MP.Error.Full = This multiplayer session is full.
CS2MP.Error.Full.Help = Ask the host to increase Max Players, or wait until another player leaves.
CS2MP.Error.Address = The host address could not be found.
CS2MP.Error.Address.Help = Check the address for typing mistakes. On the same home network, use the host PC's local IP address.
CS2MP.Error.Refused = The host PC answered, but no multiplayer session is listening on that port.
CS2MP.Error.Refused.Help = Make sure the host clicked Host Session and that both players entered the same port.
CS2MP.Error.Timeout = The host did not answer in time.
CS2MP.Error.Timeout.Help = Check that the host is still online, verify the address and port, and allow the port through the host's firewall. Internet games also need TCP port forwarding.
CS2MP.Error.Network = This PC cannot reach the host's network.
CS2MP.Error.Network.Help = Check your internet or local-network connection, then retry. If you are on the same network, use the host's local IP.
CS2MP.Error.PortInUse = The hosting port is already being used by another program.
CS2MP.Error.PortInUse.Help = Close the other host/game instance, or choose a different port and give that same port to every player.
CS2MP.Error.Removed = The host removed you from this multiplayer session.
CS2MP.Error.Removed.Help = Ask the host before trying to join again.
CS2MP.Error.Declined = The host did not let you into the session.
CS2MP.Error.Declined.Help = The host must approve your join. Ask them to let you in, then try again.
CS2MP.Error.Generic = Multiplayer could not complete the connection.
CS2MP.Error.Generic.Help = Try once more. If it repeats, restart both games, verify the address and port, and check that the mod is updated on both PCs.


# -- Вкладка Общие --
@label.EnableMod = Включить мод
@desc.EnableMod = Включает или отключает функции мультиплеера.

@label.PlayerName = Имя игрока
@desc.PlayerName = Имя, которое будут видеть другие игроки.

@label.VerboseLogging = Подробный лог
@desc.VerboseLogging = Записывает дополнительную отладочную информацию.

@label.StatusRole = Роль
@desc.StatusRole = Показывает статус: оффлайн, хост или клиент.

@label.StatusState = Соединение
@desc.StatusState = Текущее состояние подключения или последняя ошибка.

@label.StatusPlayers = Игроки
@desc.StatusPlayers = Игроки, подключенные к сессии.

@label.StatusAccess = Доступ
@desc.StatusAccess = Требуется ли пароль для входа.

@label.StatusExposure = Сеть
@desc.StatusExposure = Локальная сеть (LAN) или открыто для Интернета/LAN.

@label.StatusWorld = Мир
@desc.StatusWorld = Состояние загрузки или хостинга города.

@label.DisconnectButton = Отключиться
@desc.DisconnectButton = Покинуть сессию и закрыть все подключения.

# -- Вкладка Подключиться --
@label.JoinConnection = Тип подключения
@desc.JoinConnection = Выберите Steam Relay или Прямое подключение.

@label.JoinCodeInput = Код подключения
@desc.JoinCodeInput = Код, предоставленный хостом.

@label.ServerAddress = Адрес хоста
@desc.ServerAddress = IP-адрес или доменное имя сервера.

@label.JoinPort = Порт
@desc.JoinPort = TCP-порт хоста (по умолчанию: 25001).

@label.JoinPassword = Пароль
@desc.JoinPassword = Пароль сервера (если установлен).

@label.JoinStatus = Статус
@desc.JoinStatus = Текущий статус подключения.

@label.JoinButton = Войти в игру
@desc.JoinButton = Подключиться к хосту и загрузить город.

@label.JoinDisconnectButton = Отключиться
@desc.JoinDisconnectButton = Покинуть текущую сессию.

# -- Вкладка Создать игру --
@label.HostConnection = Тип подключения
@desc.HostConnection = Метод подключения для хостинга.

@label.HostJoinCode = Ваш код подключения
@desc.HostJoinCode = Отправьте этот код друзьям для подключения через Steam Relay.

@label.HostPort = Порт сервера
@desc.HostPort = Порт для прослушивания (1-65535, по умолчанию: 25001).

@label.HostPassword = Пароль сервера
@desc.HostPassword = Пароль, необходимый для входа.

@label.HostMaxPlayers = Макс. игроков
@desc.HostMaxPlayers = Максимальное количество игроков (2-16).

@label.HostLanOnly = Только локальная сеть (LAN)
@desc.HostLanOnly = Разрешить подключение только игрокам в локальной сети.

@label.HostAutoSyncMinutes = Интервал автосинхронизации (мин)
@desc.HostAutoSyncMinutes = Интервал между полными сохранениями (0 для отключения).

@label.HostStatus = Статус
@desc.HostStatus = Состояние сервера.

@label.HostButton = Запустить сервер
@desc.HostButton = Открыть текущий город для совместной игры.

@label.HostStopButton = Остановить сервер
@desc.HostStopButton = Завершить сессию мультиплеера.

@label.HostSaveRecoveryButton = Сохранить общий город
@desc.HostSaveRecoveryButton = Сохранить текущее состояние города.


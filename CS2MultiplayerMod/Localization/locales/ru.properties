# ===================== Other-mods block =====================
CS2MP.UI.ModsBlockedTitle = Включены другие моды
CS2MP.UI.ModsBlocked = Совместная игра работает, только если CS2 Multiplayer Mod - единственный мод в вашем наборе. Другие моды меняют префабы, инструменты или симуляцию и приведут к рассинхронизации или вылетам. Отключите их в активном наборе: {0}
CS2MP.UI.ModsBlockedRestart = Совместная игра работает, только если CS2 Multiplayer Mod - единственный мод в вашем наборе. Другие моды меняют префабы, инструменты или симуляцию и приведут к рассинхронизации или вылетам. Эти моды всё ещё загружены, поэтому после их отключения перезапустите игру: {0}
CS2MP.UI.ModsIgnoredTitle = Проверка совместимости пропущена
CS2MP.UI.ModsIgnored = Активны другие моды, но включён параметр «Игнорировать проверки совместимости модов»: {0}. Совместная игра продолжится на ваш страх и риск; возможны рассинхронизация, повреждённые города и вылеты. Делайте резервные копии сохранений и убедитесь, что каждый игрок осознанно принимает тот же риск.


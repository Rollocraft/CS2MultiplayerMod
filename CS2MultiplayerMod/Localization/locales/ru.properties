CS2MP.Error.ModVersion.Help = Обоим игрокам следует обновить мод до одной и той же версии, перезапустить игру и повторить попытку.
CS2MP.Error.GameVersion = Ваши версии Cities: Skylines II не совпадают.
CS2MP.Error.GameVersion.Help = Обновите игру на обоих ПК и убедитесь, что оба игрока используют одну и ту же ветку Steam, затем перезапустите игру.
CS2MP.Error.Dlc = Включённые DLC у хоста и этого игрока не совпадают.
CS2MP.Error.Dlc.Help = Включите одинаковые DLC на обоих ПК, перезапустите игру и повторите попытку.
CS2MP.Error.Mods = Включены другие моды.
CS2MP.Error.Mods.Help = Совместная игра не поддерживает другие моды. Отключите в активном наборе все моды, кроме CS2 Multiplayer Mod, затем перезапустите игру.
CS2MP.Error.ModSet = У хоста и этого игрока включены разные моды.
CS2MP.Error.ModSet.Help = Включите на обоих ПК одинаковые моды одинаковых версий, перезапустите игру и повторите попытку.
CS2MP.Error.PublicPassword = Для хостинга через интернет нужен пароль сервера.
CS2MP.Error.PublicPassword.Help = Задайте пароль сервера не короче 8 символов, включите Только локальная сеть или используйте ретранслятор Steam.
CS2MP.Error.Full = Эта совместная сессия заполнена.
CS2MP.Error.Full.Help = Попросите хоста увеличить значение «Макс. игроков» или дождитесь, пока кто-нибудь выйдет.
CS2MP.Error.Address = Не удалось найти адрес хоста.
CS2MP.Error.Address.Help = Проверьте адрес на опечатки. В одной домашней сети используйте локальный IP-адрес ПК хоста.
CS2MP.Error.Refused = ПК хоста ответил, но на этом порте не слушает ни одна совместная сессия.
CS2MP.Error.Refused.Help = Убедитесь, что хост нажал «Создать сессию» и что оба игрока ввели один и тот же порт.
CS2MP.Error.Timeout = Хост не ответил вовремя.
CS2MP.Error.Timeout.Help = Проверьте, что хост всё ещё в сети, сверьте адрес и порт и разрешите порт в брандмауэре хоста. Для игры через интернет также нужен проброс TCP-порта.
CS2MP.Error.Network = Этот ПК не может связаться с сетью хоста.
CS2MP.Error.Network.Help = Проверьте интернет-соединение или локальную сеть и повторите попытку. Если вы в одной сети, используйте локальный IP хоста.
CS2MP.Error.PortInUse = Порт хостинга уже занят другой программой.
CS2MP.Error.PortInUse.Help = Закройте другую копию сервера или игры либо выберите другой порт и сообщите всем игрокам именно этот порт.
CS2MP.Error.Removed = Хост удалил вас из этой совместной сессии.
CS2MP.Error.Removed.Help = Свяжитесь с хостом, прежде чем пытаться подключиться снова.
CS2MP.Error.Declined = Хост не впустил вас в сессию.
CS2MP.Error.Declined.Help = Хост должен подтвердить ваше подключение. Попросите его впустить вас и повторите попытку.
CS2MP.Error.Generic = Не удалось установить соединение для совместной игры.
CS2MP.Error.Generic.Help = Попробуйте ещё раз. Если ошибка повторяется, перезапустите обе копии игры, сверьте адрес и порт и убедитесь, что мод обновлён на обоих ПК.
CS2MP.Diagnostics.None = Ещё не сохранено
CS2MP.Diagnostics.Saved = Сохранено: {0}
CS2MP.Diagnostics.Failed = Не удалось сохранить - см. журнал

# ===================== Host tab state line =====================
CS2MP.Host.LoadCityFirst = Выберите «Совместная игра > Создать игру», чтобы загрузить или создать город, либо загрузите город обычным способом перед запуском сервера.
CS2MP.Host.Ready = Готово к хостингу текущего города.
CS2MP.Host.SessionActive = Совместная сессия уже активна.

# ===================== Connection mode =====================
CS2MP.Connection.Relay = Ретранслятор Steam
CS2MP.Connection.Direct = Прямое подключение
CS2MP.Connection.Mode = Соединение
CS2MP.Connection.JoinCode = Код подключения
CS2MP.Connection.JoinCodeUnavailable = Недоступно - запустите игру через Steam
CS2MP.Connection.JoinCodeHint = Отправьте этот код друзьям. Они выбирают «Ретранслятор Steam» на своём экране подключения и вводят его - больше ничего настраивать не нужно.
CS2MP.Connection.JoinCodeSelectHint = Щёлкните по коду, чтобы выделить его, затем нажмите Ctrl+C.
CS2MP.Connection.JoinCodeEntry = Код подключения
CS2MP.Connection.JoinCodeEntryHint = Вставьте код, который вам дал хост.
CS2MP.Connection.RelayHint = Друзья подключаются по вашему коду. Без проброса портов и без настройки роутера.
CS2MP.Connection.DirectHint = Игроки подключаются к вашему адресу и порту. Порт должен быть проброшен на роутере.
CS2MP.Connection.RelayUnavailableHint = Steam сейчас недоступен, поэтому хостинг через ретранслятор запустить нельзя. Используйте прямое подключение или запустите игру через Steam.

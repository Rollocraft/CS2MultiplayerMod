# -- General tab --
@label.ModVersion = Версия
@desc.ModVersion = Версия мода, запущенная в этой игре, - укажите её в отчёте об ошибке. Собранная вами копия дополнительно показывает время сборки и сетевой протокол, на котором она говорит.

@label.EnableMod = Включить мод
@desc.EnableMod = Включает или выключает мод для совместной игры.

@label.PlayerName = Имя игрока
@desc.PlayerName = Имя, под которым вас видят другие игроки.

@label.ShowPartnerMarkers = Показывать метки партнёров
@desc.ShowPartnerMarkers = ?????????? ??????? ?????, ??????? ???????? ??? ???????? ? ?????????? ????????????? ?????????? ?????? ???????. ????????? ???? ????????, ????? ?????? ??.

@label.VerboseLogging = Подробный журнал
@desc.VerboseLogging = Добавляет в журнал подробности каждого действия. Подключения, отключения, передача города, каждая пересинхронизация и её причина, отброшенные действия, версия мода, список других активных модов и все ошибки записываются и без этой опции. Включайте её, когда вас просят прислать полный журнал: журнал станет длиннее, но на скорость игры это не влияет.

@label.ExportDiagnosticsButton = Сохранить диагностику
@desc.ExportDiagnosticsButton = Записывает в папку Logs игры один файл с текущим состоянием сессии и журналом мода CS2MP-flight.log, готовый для прикрепления к отчёту об ошибке. Во время сессии то же самое делает команда /diag в чате мультиплеера.

@label.DiagnosticsStatus = Файл диагностики
@desc.DiagnosticsStatus = Последний файл, записанный кнопкой Сохранить диагностику, в папке Logs игры. Проверьте его перед публикацией.

# -- Действия сессии (вкладка «Общие») --
@label.DisconnectButton = Отключиться
@desc.DisconnectButton = Покинуть сессию - или закрыть её, если вы хост - и разорвать все соединения.

# -- Join tab --
@label.JoinConnection = Соединение
@desc.JoinConnection = Ретранслятор Steam подключает вас к хосту по коду, который он вам дал, - без адреса и порта. Прямое подключение - исходный способ: введите адрес и порт хоста. Используйте то, что выбрал хост.

@label.JoinCodeInput = Код подключения
@desc.JoinCodeInput = Код, который хост видит на своём экране хостинга. Больше ничего совпадать не должно.

@label.ServerAddress = Адрес хоста
@desc.ServerAddress = IP-адрес или имя узла игрока, который создал игру (он видит его в своём журнале при запуске хостинга).

@label.JoinPort = Порт
@desc.JoinPort = TCP-порт хоста (по умолчанию 25001). Должен точно совпадать с портом, который открыл хост.

@label.JoinPassword = Пароль
@desc.JoinPassword = Пароль сервера хоста, если он задан. Он никогда не передаётся в открытом виде.

@label.JoinStatus = Состояние
@desc.JoinStatus = Текущее состояние соединения. Подключаться можно из главного меню - город передаётся от хоста.

@label.JoinButton = Присоединиться к сессии
@desc.JoinButton = Подключается к указанному выше хосту и скачивает его город. Работает из главного меню; локальное сохранение не нужно. То же действие, что и окно «Присоединиться к игре» в главном меню.

@label.JoinDisconnectButton = Отключиться
@desc.JoinDisconnectButton = Покидает текущую сессию и закрывает все соединения.

# -- Host tab --
@label.HostConnection = Соединение
@desc.HostConnection = С ретранслятором Steam друзья подключаются по одному лишь коду - не нужно открывать порт и настраивать роутер. Прямое подключение - исходный способ: требуется проброс порта, но Steam не нужен.

@label.HostJoinCode = Ваш код подключения
@desc.HostJoinCode = Передайте его друзьям. Они вставляют его в поле «Адрес хоста» на своём экране подключения и сразу соединяются.

@label.HostPort = Порт для открытия
@desc.HostPort = TCP-порт, который слушает ваш сервер (1-65535, по умолчанию 25001). Подключающиеся игроки должны ввести именно этот порт. Для игры через интернет пробросьте этот TCP-порт на роутере на этот ПК и разрешите его в брандмауэре Windows.

@label.HostPassword = Пароль сервера
@desc.HostPassword = Игроки должны ввести его, чтобы подключиться (он никогда не передаётся в открытом виде). Обязателен при хостинге через прямое подключение в интернете: не менее 8 символов, иначе любой, кто найдёт порт, сможет подключиться и скачать ваш город. Ретранслятору Steam и режиму Только локальная сеть он не нужен.

@label.LanOnly = Только локальная сеть
@desc.LanOnly = Принимать только игроков из вашей локальной сети. По умолчанию выключено, чтобы друзья могли подключаться через интернет (для этого нужны проброс порта и пароль сервера не короче 8 символов).

@label.RequireJoinApproval = Подтверждать подключение игроков
@desc.RequireJoinApproval = Когда включено, каждый игрок при попытке подключиться ждёт, пока вы примете или отклоните запрос. Отключите, чтобы автоматически впускать всех, кто прошёл проверку пароля и версии.

@label.AutoApproveSteamFriends = Автоматически одобрять друзей Steam
@desc.AutoApproveSteamFriends = Когда подтверждение игроков включено, авторизованные друзья Steam подключаются сразу. Остальные по-прежнему ждут вашего подтверждения. Только для Steam Relay.

@label.ResyncPolicy = Запросы клиентов на пересинхронизацию
@desc.ResyncPolicy = Сразу разрешайте запросы синхронизации мира, подтверждайте их перед запуском или оставьте синхронизацию только хосту. Автоматические запросы восстановления подчиняются тому же правилу.

@label.MaxPlayers = Макс. игроков
@desc.MaxPlayers = Максимальное число одновременных игроков, включая вас (2-32).


@label.HostStatus = Состояние хостинга
@desc.HostStatus = Для хостинга нужен загруженный город: ваш город и есть мир, в котором играют все.

@label.HostButton = Создать сессию
@desc.HostButton = Открывает ваш текущий город как сервер на указанном выше порте. В журнале перечислены точные адреса, которые могут использовать другие игроки. Подключающиеся игроки получают карту автоматически.

@label.SyncWorldButton = Синхронизировать мир
@desc.SyncWorldButton = Немедленно отправляет ваш город всем подключённым игрокам заново, заменяя их копию. Используйте это, чтобы устранить расхождения между игроками. То же, что и кнопка «Синхронизировать мир» на панели совместной игры в игре, - здесь она оставлена как запасной вариант на случай, если та кнопка отсутствует.

# -- Вкладка «Дополнительно» --
@label.IgnoreModCompatibilityChecks = Игнорировать проверки совместимости модов (на свой риск)
@desc.IgnoreModCompatibilityChecks = Разрешает другие активные моды, а при хостинге - и другие версии CS2 Multiplayer Mod. Это может привести к рассинхронизации, повреждённым городам или вылетам. Проверки протокола, версии игры и DLC по-прежнему выполняются. Меняйте только вне сессии.

